# 用指令部署嘅設定檔。喺呢個 worker/ 資料夾入面執行：
#
#     npx wrangler login      # 第一次先做，會開瀏覽器叫你授權
#     npx wrangler deploy
#
# 部署完會印出你個網址，形如 https://findcarpark-proxy.<你嘅帳號>.workers.dev
# 唔想用指令？照跟 README.md 喺 Cloudflare 網頁度複製貼上一樣得。

name = "findcarpark-proxy"
main = "worker.js"
compatibility_date = "2026-09-22"
workers_dev = true

# APPCODE 建議用 Secret 存放，唔好寫死喺呢度：
#     npx wrangler secret put APPCODE
# 冇設定就會用 worker.js 入面嘅預設值。
