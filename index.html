          { id: '72', name: '澳大P1A停車場', region: '路氹 / 澳大', lat: 22.1340, lng: 113.5410, phone: '2888 1112', address: '橫琴澳大校區', fees: { day: 6, night: 3 }, capacity: { light: 150, ev: 0, moto: 50, heavy: 0 } },

          // 路環區
          { id: '46', name: '和諧廣場停車場', region: '路環區', lat: 22.1384, lng: 113.5567, phone: '2888 2222', address: '路環石排灣', fees: { day: 6, night: 3 }, capacity: { light: 600, ev: 20, moto: 300, heavy: 0 } },
          { id: '47', name: '石排灣居雅大廈停車場', region: '路環區', lat: 22.1390, lng: 113.5580, phone: '2888 5555', address: '路環石排灣', fees: { day: 6, night: 3 }, capacity: { light: 400, ev: 10, moto: 150, heavy: 0 } },
          { id: '48', name: '石排灣業興大廈停車場', region: '路環區', lat: 22.1375, lng: 113.5590, phone: '2888 6666', address: '路環石排灣', fees: { day: 6, night: 3 }, capacity: { light: 350, ev: 10, moto: 120, heavy: 0 } },
          { id: '49', name: '石排灣樂群樓停車場', region: '路環區', lat: 22.1380, lng: 113.5575, phone: '2888 7777', address: '路環石排灣', fees: { day: 6, night: 3 }, capacity: { light: 450, ev: 15, moto: 180, heavy: 0 } },
          { id: '50', name: '蝴蝶谷大馬路總站停車場', region: '路環區', lat: 22.1360, lng: 113.5560, phone: '2888 8888', address: '路環石排灣', fees: { day: 6, night: 3 }, capacity: { light: 250, ev: 5, moto: 100, heavy: 0 } },
          { id: '51', name: '聯生工業邨停車場', region: '路環區', lat: 22.1320, lng: 113.5540, phone: '2888 9999', address: '路環聯生', fees: { day: 6, night: 3 }, capacity: { light: 300, ev: 5, moto: 100, heavy: 0 } },
          { id: '52', name: '黑沙海灘公園停車場', region: '路環區', lat: 22.1180, lng: 113.5700, phone: '2888 0000', address: '路環黑沙', fees: { day: 6, night: 3 }, capacity: { light: 150, ev: 0, moto: 80, heavy: 0 } },
          { id: '69', name: '聯生圓形地停車場', region: '路環區', lat: 22.1330, lng: 113.5530, phone: '2888 9998', address: '路環', fees: { day: 6, night: 3 }, capacity: { light: 100, ev: 0, moto: 50, heavy: 0 } }
        ];

        function App() {
          const [userLocation, setUserLocation] = useState(null);
          const [radius, setRadius] = useState(1000); 
          const [sortBy, setSortBy] = useState('distance'); 
          const [vehicleType, setVehicleType] = useState('light'); 
          const [selectedRegion, setSelectedRegion] = useState('全部'); 
          
          // 修改：將基礎數據獨立存放，不再依賴定位坐標
          const [baseParksData, setBaseParksData] = useState([]); 
          const [loading, setLoading] = useState(false);
          const [error, setError] = useState(null);
          const [activeNavId, setActiveNavId] = useState(null); 
          const [lastUpdated, setLastUpdated] = useState(null);

          // 接上澳門政府真實 API 的邏輯
          const fetchRealtimeData = async () => {
            try {
              const targetUrl = encodeURIComponent('https://api.data.gov.mo/document/download/ea50a770-cc35-47cc-a3ba-7f60092d4bc4?token=5noP7ySJuj4qVTPB0qZdg1pzJQvezRypy&isNeedFile=0&lang=TC');
              const res = await fetch(`https://api.allorigins.win/get?url=${targetUrl}`);
              const json = await res.json();
              
              if (json && json.contents) {
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(json.contents, "text/xml");
                const carParks = xmlDoc.getElementsByTagName("Car_park_info");
                
                if (carParks.length > 0) {
                  let results = [];
                  for (let i = 0; i < carParks.length; i++) {
                    const cp = carParks[i];
                    const nameNode = cp.getElementsByTagName("Title")[0] || cp.getElementsByTagName("name")[0];
                    const name = nameNode ? nameNode.textContent : "";
                    
                    const lightNode = cp.getElementsByTagName("light_car")[0];
                    const lightText = lightNode ? lightNode.textContent : "0";
                    
                    const motoNode = cp.getElementsByTagName("motorcycle")[0];
                    const motoText = motoNode ? motoNode.textContent : "0";
                    
                    if(name) {
                        results.push({
                          id: name,
                          name: name,
                          spaces: { 
                              light: parseInt(lightText) || 0, 
                              ev: 0, 
                              moto: parseInt(motoText) || 0, 
                              heavy: 0 
                          }
                        });
                    }
                  }
                  if (results.length > 0) {
                      return results;
                  }
                }
              }
              throw new Error("無效的數據格式");
            } catch (err) {
              console.warn("真實政府 API 獲取失敗:", err);
              throw err;
            }
          };

          // 新增：載入並合併基礎資料（無須 GPS 即可呼叫）
          const loadBaseData = async (isBackground = false) => {
            if (!isBackground) setLoading(true);
            try {
              const realtimeData = await fetchRealtimeData();
              if (realtimeData) {
                setLastUpdated(new Date());
                setError(null);
                const processedParks = MACAU_CARPARKS_DB.map(park => {
                  const realtimeInfo = realtimeData.find(d => 
                      d.name.includes(park.name) || park.name.includes(d.name)
                  );
                  
                  const spaces = realtimeInfo ? realtimeInfo.spaces : { light: 0, ev: 0, moto: 0, heavy: 0 };
                  const totalSpaces = spaces.light + spaces.ev + spaces.moto + spaces.heavy;
                  const currentFeeInfo = getCurrentFeeInfo(park.fees);

                  return {
                    ...park,
                    spaces,
                    totalSpaces,
                    currentFee: currentFeeInfo.fee,
                    feeLabel: currentFeeInfo.label,
                    capacity: park.capacity
                  };
                });
                setBaseParksData(processedParks);
              }
            } catch (err) {
              setError("無法讀取政府數據，請稍後再試。");
              const processedParks = MACAU_CARPARKS_DB.map(park => {
                const currentFeeInfo = getCurrentFeeInfo(park.fees);
                return {
                  ...park,
                  spaces: { light: 0, ev: 0, moto: 0, heavy: 0 },
                  totalSpaces: 0,
                  currentFee: currentFeeInfo.fee,
                  feeLabel: currentFeeInfo.label,
                  capacity: park.capacity
                };
              });
              setBaseParksData(processedParks);
            } finally {
              if (!isBackground) setLoading(false);
            }
          };

          // 初次掛載時及每 30 秒自動更新
          useEffect(() => {
            loadBaseData(false); // 初始載入（會顯示轉圈動畫）
            const timer = setInterval(() => {
              loadBaseData(true); // 背景安靜載入
            }, 30000); 
            return () => clearInterval(timer); 
          }, []);

          const calculateDistance = (lat1, lon1, lat2, lon2) => {
            const R = 6371e3; 
            const φ1 = lat1 * Math.PI / 180;
            const φ2 = lat2 * Math.PI / 180;
            const Δφ = (lat2 - lat1) * Math.PI / 180;
            const Δλ = (lon2 - lon1) * Math.PI / 180;

            const a = Math.sin(Δφ / 2) * Math.sin(Δφ / 2) +
                      Math.cos(φ1) * Math.cos(φ2) *
                      Math.sin(Δλ / 2) * Math.sin(Δλ / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c; 
          };

          const getCurrentFeeInfo = (fees) => {
            const hour = new Date().getHours();
            const isDayTime = hour >= 8 && hour < 20; 
            const currentFee = isDayTime ? fees.day : fees.night;
            const timeLabel = isDayTime ? '日間 08:00-20:00' : '夜間 20:00-08:00';
            return { fee: currentFee, label: timeLabel };
          };

          const openMap = (type, lat, lng, name) => {
            let url = '';
            if (type === 'google') {
              url = `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`;
            } else if (type === 'apple') {
              url = `http://maps.apple.com/?daddr=${lat},${lng}`;
            } else if (type === 'amap') {
              url = `https://uri.amap.com/navigation?to=${lng},${lat},${name}&mode=car`;
            }
            window.open(url, '_blank');
          };

          const getRelevantSpaces = (park, type) => {
            if (type === 'light') return park.spaces.light;
            if (type === 'ev') return park.spaces.ev;
            if (type === 'moto') return park.spaces.moto;
            return park.totalSpaces;
          };

          const regionStats = useMemo(() => {
            if (!baseParksData.length) return null;
            let targetParks = selectedRegion === '全部' ? baseParksData : baseParksData.filter(p => p.region === selectedRegion);
            
            let stats = {
              light: { available: 0, total: 0 },
              ev: { available: 0, total: 0 },
              moto: { available: 0, total: 0 },
              heavy: { available: 0, total: 0 }
            };

            targetParks.forEach(p => {
              stats.light.available += p.spaces.light;
              stats.light.total += p.capacity.light;
              stats.ev.available += p.spaces.ev;
              stats.ev.total += p.capacity.ev;
              stats.moto.available += p.spaces.moto;
              stats.moto.total += p.capacity.moto;
              stats.heavy.available += p.spaces.heavy;
              stats.heavy.total += p.capacity.heavy;
            });
            return { count: targetParks.length, stats };
          }, [baseParksData, selectedRegion]);

          // 動態計算距離及排序 (綁定 useLocation 變化)
          const displayedParks = useMemo(() => {
            if (!baseParksData.length) return [];
            
            // 賦予動態距離
            let filtered = baseParksData.map(park => {
                if (userLocation) {
                    const dist = calculateDistance(userLocation.lat, userLocation.lng, park.lat, park.lng);
                    return { ...park, distance: Math.round(dist) };
                }
                return { ...park, distance: null };
            });
            
            if (selectedRegion !== '全部') {
                filtered = filtered.filter(park => park.region === selectedRegion);
            }

            if (userLocation && radius !== Infinity) {
                filtered = filtered.filter(park => park.distance !== null && park.distance <= radius);
            }

            filtered.sort((a, b) => {
              const aSpaces = getRelevantSpaces(a, vehicleType);
              const bSpaces = getRelevantSpaces(b, vehicleType);
              const aEmpty = aSpaces === 0;
              const bEmpty = bSpaces === 0;

              if (aEmpty && !bEmpty) return 1;
              if (!aEmpty && bEmpty) return -1;

              if (sortBy === 'distance') {
                  if (a.distance !== null && b.distance !== null) {
                      return a.distance - b.distance;
                  }
                  return 0; // 若無定位資訊則保持原有順序
              }
              if (sortBy === 'spaces') return bSpaces - aSpaces;
              if (sortBy === 'fee') return a.currentFee - b.currentFee;
              return 0;
            });

            return filtered;
          }, [baseParksData, radius, sortBy, vehicleType, selectedRegion, userLocation]);

          const handleFindParking = () => {
            if (!navigator.geolocation) {
              setError("您的瀏覽器不支援地理位置功能，請使用「電腦測試」按鈕。");
              return;
            }
            
            setLoading(true);
            setError(null);
            setSelectedRegion('全部'); // 核心修改：按定位時自動切換回全部

            navigator.geolocation.getCurrentPosition(
              (position) => {
                setUserLocation({ lat: position.coords.latitude, lng: position.coords.longitude });
                setLoading(false);
              },
              (err) => {
                setError("無法獲取您的位置。若在電腦上測試，請點擊下方的「模擬測試」按鈕。");
                setLoading(false);
              },
              { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
          };

          const handleMockLocation = () => {
            // 模擬位於新馬路附近的坐標
            setSelectedRegion('全部'); // 核心修改：測試時亦自動切換回全部
            setUserLocation({ lat: 22.194500, lng: 113.538500 });
          };

          const SpaceBadge = ({ iconClass, count, type, colorClass }) => (
            <div className={`flex items-center space-x-1 px-2 py-1 rounded-md border ${count > 0 ? colorClass : 'bg-gray-100 text-gray-400 border-gray-200'}`}>
              <i className={`${iconClass} text-[14px]`}></i>
              <span className="text-xs font-medium">{type}</span>
              <span className={`text-sm font-bold ml-1 ${count > 0 ? '' : 'text-gray-400'}`}>{count}</span>
            </div>
          );

          const radiusOptions = [
            { val: 500, label: '500 米' },
            { val: 1000, label: '1000 米' },
            { val: 2000, label: '2000 米' },
            { val: 3000, label: '3000 米' },
            { val: Infinity, label: '無限制' }
          ];

          // 已更新區域列表與資料庫一致
          const regionsList = [
            '全部', 
            '北區 / 黑沙環', 
            '筷子基 / 青洲 / 西北區', 
            '中區 / 荷蘭園 / 雀仔園', 
            '新口岸 / 皇朝', 
            '下環 / 內港 / 新馬路', 
            '氹仔區', 
            '路氹 / 澳大', 
            '路環區', 
            '港珠澳大橋'
          ];

          return (
            <div className="min-h-screen bg-gray-50 flex justify-center font-sans">
              <div className="w-full max-w-md bg-white shadow-xl overflow-hidden flex flex-col relative">
                
                {/* Header */}
                <div className="bg-emerald-600 text-white p-5 shadow-md z-10">
                  <div className="flex items-center justify-between mb-2">
                    <div className="flex items-center space-x-2">
                      <i className="fa-solid fa-location-dot text-2xl"></i>
                      <h1 className="text-xl font-bold">澳門找車位</h1>
                    </div>
                    {baseParksData.length > 0 && (
                      <div className="flex flex-col items-end">
                        <span className={`text-[10px] px-2 py-1 rounded-full font-bold ${error && error.includes('數據') ? 'bg-red-100 text-red-800' : 'bg-green-100 text-green-800'}`}>
                          {error && error.includes('數據') ? '未能連接數據' : '已接通政府API'}
                        </span>
                        {lastUpdated && !(error && error.includes('數據')) && (
                          <span className="text-[9px] text-emerald-100 mt-1">
                            最後更新: {lastUpdated.toLocaleString('zh-MO', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false })}
                          </span>
                        )}
                      </div>
                    )}
                  </div>
                  <p className="text-emerald-100 text-sm">已收錄全澳 {MACAU_CARPARKS_DB.length} 個公共停車場</p>
                </div>

                {/* Control Panel */}
                <div className="p-5 border-b border-gray-100 bg-white">
                  <button
                    onClick={handleFindParking}
                    disabled={loading}
                    className="w-full flex flex-col items-center justify-center bg-emerald-500 text-white py-3 px-4 rounded-2xl shadow-lg shadow-emerald-200 hover:bg-emerald-600 active:transform active:scale-95 transition-all disabled:opacity-70 mb-5"
                  >
                    <div className="flex items-center space-x-3">
                      {loading ? (
                        <i className="fa-solid fa-spinner fa-spin text-3xl"></i>
                      ) : (
                        <i className="fa-solid fa-location-crosshairs text-3xl"></i>
                      )}
                      <span className="tracking-widest font-bold text-2xl">{loading ? '定位與載入中...' : '搵 車 位'}</span>
                    </div>
                    {!loading && <span className="text-xs font-medium opacity-90 mt-1">(以手機定位找附近停車場)</span>}
                  </button>

                  <div className="mb-4">
                    <label className="block text-sm font-medium text-gray-700 mb-2">區域車位查詢</label>
                    <div className="flex flex-wrap gap-2">
                      {regionsList.map(reg => (
                        <button
                          key={reg}
                          onClick={() => setSelectedRegion(reg)}
                          className={`py-1.5 px-3 text-xs md:text-sm rounded-full transition-colors border ${
                            selectedRegion === reg 
                              ? 'bg-emerald-600 text-white border-emerald-600 font-medium shadow-sm' 
                              : 'bg-white text-gray-600 border-gray-200 hover:bg-gray-50'
                          }`}
                        >
                          {reg}
                        </button>
                      ))}
                    </div>
                  </div>

                  <div className="mb-4">
                    <label className="block text-sm font-medium text-gray-700 mb-2">駕駛車輛 (即時更新數量配對)</label>
                    <div className="grid grid-cols-3 gap-2">
                      {[
                        { id: 'light', label: '輕型車', iconClass: 'fa-solid fa-car' },
                        { id: 'ev', label: '電動車', iconClass: 'fa-solid fa-bolt' },
                        { id: 'moto', label: '電單車', iconClass: 'fa-solid fa-motorcycle' }
                      ].map(v => (
                        <button
                          key={v.id}
                          onClick={() => setVehicleType(v.id)}
                          className={`py-2 px-1 text-sm rounded-lg transition-colors flex flex-col items-center justify-center space-y-1 border ${
                            vehicleType === v.id 
                              ? 'bg-blue-50 border-blue-500 text-blue-700 font-bold shadow-sm' 
                              : 'bg-white border-gray-200 text-gray-600 hover:bg-gray-50'
                          }`}
                        >
                          <i className={`${v.iconClass} text-lg`}></i>
                          <span>{v.label}</span>
                        </button>
                      ))}
                    </div>
                  </div>

                  {userLocation && (
                    <div className="mb-4">
                      <label className="block text-sm font-medium text-gray-700 mb-2">搜尋範圍 (即時更新)</label>
                      <div className="grid grid-cols-5 gap-1.5">
                        {radiusOptions.map(r => (
                          <button
                            key={r.val}
                            onClick={() => setRadius(r.val)}
                            className={`py-2 text-[11px] rounded-lg transition-colors ${
                              radius === r.val 
                                ? 'bg-gray-800 text-white font-medium shadow-sm' 
                                : 'bg-gray-100 text-gray-600 hover:bg-gray-200'
                            }`}
                          >
                            {r.label}
                          </button>
                        ))}
                      </div>
                    </div>
                  )}

                  <div className="mb-2">
                    <label className="block text-sm font-medium text-gray-700 mb-2">排序方式</label>
                    <div className="grid grid-cols-3 gap-2">
                      {[
                        { id: 'distance', label: '距離最近' },
                        { id: 'spaces', label: '車位最多' },
                        { id: 'fee', label: '收費最低' }
                      ].map(sortOpt => (
                        <button
                          key={sortOpt.id}
                          onClick={() => setSortBy(sortOpt.id)}
                          className={`py-2 text-sm rounded-lg transition-colors border ${
                            sortBy === sortOpt.id 
                              ? 'bg-emerald-50 border-emerald-500 text-emerald-700 font-bold' 
                              : 'bg-white border-gray-200 text-gray-600 hover:bg-gray-50'
                          }`}
                        >
                          {sortOpt.label}
                        </button>
                      ))}
                    </div>
                  </div>

                  {error && (
                    <div className="mt-4 p-3 bg-red-50 text-red-600 rounded-lg flex items-start space-x-2 text-sm">
                      <i className="fa-solid fa-circle-exclamation mt-0.5"></i>
                      <span>{error}</span>
                    </div>
                  )}
                </div>

                {/* 區域車位統計 */}
                {regionStats && (
                  <div className="bg-emerald-50 px-4 py-3 border-b border-emerald-100">
                    <div className="text-sm font-bold text-emerald-800 mb-2 flex justify-between items-center">
                      <span>{selectedRegion}停車場 ({regionStats.count}個)</span>
                      <span className="text-xs font-normal text-emerald-600">空置 / 總數</span>
                    </div>
                    <div className="grid grid-cols-4 gap-2">
                      <div className={`bg-white rounded p-1.5 text-center shadow-sm border ${vehicleType === 'light' ? 'border-blue-400 ring-1 ring-blue-400' : 'border-emerald-100/50'}`}>
                        <i className="fa-solid fa-car text-blue-500 mb-1 text-sm"></i>
                        <div className="text-[10px] text-gray-500">輕型</div>
                        <div className="text-xs font-bold text-gray-800">{regionStats.stats.light.available}<span className="text-[10px] text-gray-400 font-normal">/{regionStats.stats.light.total}</span></div>
                      </div>
                      <div className={`bg-white rounded p-1.5 text-center shadow-sm border ${vehicleType === 'ev' ? 'border-green-400 ring-1 ring-green-400' : 'border-emerald-100/50'}`}>
                        <i className="fa-solid fa-bolt text-green-500 mb-1 text-sm"></i>
                        <div className="text-[10px] text-gray-500">電動</div>
                        <div className="text-xs font-bold text-gray-800">{regionStats.stats.ev.available}<span className="text-[10px] text-gray-400 font-normal">/{regionStats.stats.ev.total}</span></div>
                      </div>
                      <div className={`bg-white rounded p-1.5 text-center shadow-sm border ${vehicleType === 'moto' ? 'border-orange-400 ring-1 ring-orange-400' : 'border-emerald-100/50'}`}>
                        <i className="fa-solid fa-motorcycle text-orange-500 mb-1 text-sm"></i>
                        <div className="text-[10px] text-gray-500">電單車</div>
                        <div className="text-xs font-bold text-gray-800">{regionStats.stats.moto.available}<span className="text-[10px] text-gray-400 font-normal">/{regionStats.stats.moto.total}</span></div>
                      </div>
                      <div className="bg-white rounded p-1.5 text-center shadow-sm border border-emerald-100/50">
                        <i className="fa-solid fa-truck text-slate-500 mb-1 text-sm"></i>
                        <div className="text-[10px] text-gray-500">重型</div>
                        <div className="text-xs font-bold text-gray-800">{regionStats.stats.heavy.available}<span className="text-[10px] text-gray-400 font-normal">/{regionStats.stats.heavy.total}</span></div>
                      </div>
                    </div>
                  </div>
                )}

                {/* Results List */}
                <div className="flex-1 overflow-y-auto bg-gray-50 p-4 pb-20">
                  {displayedParks.length > 0 && (
                    <div className="text-sm text-gray-500 mb-3 flex justify-between items-center">
                      <span>{userLocation && radius !== Infinity ? `找到 ${displayedParks.length} 個停車場` : `列出 ${displayedParks.length} 個停車場`}</span>
                      <span>{userLocation ? (radius === Infinity ? '無距離限制' : `半徑 ${radius} 米內`) : '依區域查詢'}</span>
                    </div>
                  )}

                  <div className="space-y-4">
                    {displayedParks.map((park) => {
                      const relevantSpaces = getRelevantSpaces(park, vehicleType);
                      const isFull = relevantSpaces === 0;

                      return (
                        <div key={park.id} className={`bg-white p-4 rounded-xl shadow-sm border ${isFull ? 'border-red-200 opacity-80' : 'border-gray-100'}`}>
                          <div className="flex justify-between items-start mb-3">
                            <h3 className="font-bold text-gray-800 text-lg leading-tight w-3/4">
                              {park.name}
                              {isFull && <span className="ml-2 align-middle text-[10px] bg-red-100 text-red-600 px-2 py-0.5 rounded-full font-bold">已滿</span>}
                            </h3>
                            {park.distance !== null && (
                              <div className="bg-emerald-100 text-emerald-700 text-xs font-bold px-2 py-1 rounded-full whitespace-nowrap">
                                距 {park.distance}m
                              </div>
                            )}
                          </div>

                          <div className="bg-gray-50 p-3 rounded-lg mb-3 text-sm text-gray-600">
                            <div className="flex items-center space-x-2 mb-2 border-b border-gray-200 pb-2">
                              <i className="fa-solid fa-dollar-sign text-emerald-600 text-lg"></i>
                              <span className="flex-1">現時收費：</span>
                              <strong className="text-emerald-700 text-lg">${park.currentFee}</strong> 
                              <span>/小時 <span className="text-xs text-gray-400">({park.feeLabel})</span></span>
                            </div>
                             <div className="flex flex-col space-y-1 mb-2 border-b border-gray-200 pb-2 text-xs">
                                <div className="flex justify-between">
                                    <span className="text-gray-500">日間收費 (08:00-20:00)</span>
                                    <span className="font-medium">${park.fees.day}/小時</span>
                                </div>
                                <div className="flex justify-between">
                                    <span className="text-gray-500">夜間收費 (20:00-08:00)</span>
                                    <span className="font-medium">${park.fees.night}/小時</span>
                                </div>
                            </div>

                            <div className="flex items-start space-x-2 mb-1.5 mt-2">
                              <i className="fa-solid fa-map text-blue-500 mt-0.5"></i>
                              <span className="leading-tight">地址：{park.address}</span>
                            </div>
                            <div className="flex items-center space-x-2">
                              <i className="fa-solid fa-phone text-orange-500"></i>
                              <span>聯絡電話：{park.phone}</span>
                            </div>
                          </div>

                          <div className="grid grid-cols-2 gap-2 mt-2">
                            <SpaceBadge 
                              iconClass="fa-solid fa-car" count={park.spaces.light} type="輕型" 
                              colorClass={vehicleType === 'light' ? (park.spaces.light > 10 ? 'bg-blue-100 text-blue-800 border-blue-300 ring-1 ring-blue-300' : park.spaces.light > 0 ? 'bg-orange-100 text-orange-800 border-orange-300 ring-1 ring-orange-300' : '') : (park.spaces.light > 10 ? 'bg-blue-50 text-blue-700 border-blue-200' : park.spaces.light > 0 ? 'bg-orange-50 text-orange-700 border-orange-200' : '')} 
                            />
                            <SpaceBadge 
                              iconClass="fa-solid fa-bolt" count={park.spaces.ev} type="電動" 
                              colorClass={vehicleType === 'ev' ? (park.spaces.ev > 0 ? 'bg-green-100 text-green-800 border-green-300 ring-1 ring-green-300' : '') : (park.spaces.ev > 0 ? 'bg-green-50 text-green-700 border-green-200' : '')} 
                            />
                            <SpaceBadge 
                              iconClass="fa-solid fa-motorcycle" count={park.spaces.moto} type="電單車" 
                              colorClass={vehicleType === 'moto' ? (park.spaces.moto > 10 ? 'bg-purple-100 text-purple-800 border-purple-300 ring-1 ring-purple-300' : park.spaces.moto > 0 ? 'bg-orange-100 text-orange-800 border-orange-300 ring-1 ring-orange-300' : '') : (park.spaces.moto > 10 ? 'bg-purple-50 text-purple-700 border-purple-200' : park.spaces.moto > 0 ? 'bg-orange-50 text-orange-700 border-orange-200' : '')} 
                            />
                            <SpaceBadge 
                              iconClass="fa-solid fa-truck" count={park.spaces.heavy} type="重型" 
                              colorClass={park.spaces.heavy > 0 ? 'bg-slate-50 text-slate-700 border-slate-200' : ''} 
                            />
                          </div>

                          <div className="mt-4 pt-3 border-t border-gray-50 flex flex-col">
                            <button
                              onClick={() => setActiveNavId(activeNavId === park.id ? null : park.id)}
                              className="flex items-center justify-center space-x-1 text-emerald-600 bg-emerald-50 py-2 rounded-lg font-medium hover:bg-emerald-100 transition-colors"
                            >
                              <i className="fa-solid fa-location-arrow"></i>
                              <span>去停車場</span>
                              <i className={`fa-solid fa-chevron-${activeNavId === park.id ? 'up' : 'down'}`}></i>
                            </button>

                            {activeNavId === park.id && (
                              <div className="flex space-x-2 mt-2">
                                <button onClick={() => openMap('google', park.lat, park.lng, park.name)} className="flex-1 text-xs py-2 bg-blue-50 text-blue-700 rounded-md hover:bg-blue-100 flex flex-col items-center justify-center space-y-1 transition-colors">
                                  <span className="font-semibold text-sm">Google</span>
                                  <span>Maps</span>
                                </button>
                                <button onClick={() => openMap('apple', park.lat, park.lng, park.name)} className="flex-1 text-xs py-2 bg-gray-100 text-gray-800 rounded-md hover:bg-gray-200 flex flex-col items-center justify-center space-y-1 transition-colors">
                                  <span className="font-semibold text-sm">Apple</span>
                                  <span>Maps</span>
                                </button>
                                <button onClick={() => openMap('amap', park.lat, park.lng, park.name)} className="flex-1 text-xs py-2 bg-sky-50 text-sky-700 rounded-md hover:bg-sky-100 flex flex-col items-center justify-center space-y-1 transition-colors">
                                  <span className="font-semibold text-sm">高德</span>
                                  <span>地圖</span>
                                </button>
                              </div>
                            )}
                          </div>
                        </div>
                      );
                    })}

                    {!loading && displayedParks.length === 0 && !error && (
                      <div className="text-center text-gray-400 py-10">
                        <p>無符合條件的停車場</p>
                      </div>
                    )}
                  </div>
                </div>

                <button
                  onClick={handleMockLocation}
                  disabled={loading}
                  className="fixed bottom-6 right-6 flex items-center justify-center space-x-2 bg-slate-800 text-white p-3 md:px-5 md:py-3 rounded-full shadow-2xl hover:bg-slate-700 active:transform active:scale-95 transition-all z-50 border border-slate-600 disabled:opacity-70"
                  title="模擬身處新馬路 (測試用)"
                >
                  <i className="fa-solid fa-desktop"></i>
                  <span className="text-sm font-medium hidden md:block">模擬新馬路測試</span>
                </button>

              </div>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
