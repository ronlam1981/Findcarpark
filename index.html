    { id:'52', name:'黑沙海灘公園停車場',    region:'路環區', lat:22.1180, lng:113.5700, phone:'2888 0000', address:'路環黑沙',             capacity:{light:150,  ev:0,  moto:80,  heavy:0} },
    { id:'69', name:'聯生圓形地停車場',      region:'路環區', lat:22.1330, lng:113.5530, phone:'2888 9998', address:'路環',                 capacity:{light:100,  ev:0,  moto:50,  heavy:0} }
  ];

  const REGIONS = [
    '全部','北區 / 黑沙環','筷子基 / 青洲 / 西北區','中區 / 荷蘭園 / 雀仔園',
    '新口岸 / 皇朝','下環 / 內港 / 新馬路','氹仔區','路氹 / 澳大','路環區','港珠澳大橋'
  ];

  /* ─── Utility ─── */
  function calcDistance(lat1, lon1, lat2, lon2) {
    var R = 6371000;
    var f1 = lat1 * Math.PI / 180, f2 = lat2 * Math.PI / 180;
    var df = (lat2 - lat1) * Math.PI / 180, dl = (lon2 - lon1) * Math.PI / 180;
    var a = Math.sin(df/2)*Math.sin(df/2) + Math.cos(f1)*Math.cos(f2)*Math.sin(dl/2)*Math.sin(dl/2);
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  }

  function feeInfo() {
    var h = new Date().getHours();
    return (h >= 8 && h < 20) ? { fee:6, label:'日間 08:00-20:00' } : { fee:3, label:'夜間 20:00-08:00' };
  }

  function getVal(el, tags) {
    for (var i = 0; i < tags.length; i++) {
      var nodes = el.getElementsByTagName(tags[i]);
      if (nodes.length > 0 && nodes[0].textContent.trim()) {
        return nodes[0].textContent.trim();
      }
    }
    return '';
  }

  function toInt(s) { return parseInt(s, 10) || 0; }
  function toFloat(s) { return parseFloat(s) || 0; }

  /* ─── XML Parsers ─── */
  function parseMaintenanceXml(text) {
    var parser = new DOMParser();
    var doc = parser.parseFromString(text, 'text/xml');
    var items = doc.getElementsByTagName('carparkInfo');
    if (!items.length) items = doc.getElementsByTagName('CarParkInfo');
    if (!items.length) items = doc.getElementsByTagName('Car_park_info');
    var result = [];
    for (var i = 0; i < items.length; i++) {
      var el = items[i];
      var no   = getVal(el, ['CAR_PARK_NO','car_park_no','NO','id']);
      var name = getVal(el, ['CNAME','cname','Title','name','ENAME']);
      var lc   = toInt(getVal(el, ['CAR_CNT','car_cnt','light_car','LIGHT_CNT','CAR']));
      var mo   = toInt(getVal(el, ['MO_CNT','mo_cnt','MB_CNT','motorcycle','MOTO_CNT','MOTO']));
      var ev   = toInt(getVal(el, ['EV_CNT','ev_cnt','EV']));
      var hv   = toInt(getVal(el, ['HEAVY_CNT','heavy_cnt','HEAVY']));
      if (name || no) {
        result.push({ no: no, name: name, light: lc, moto: mo, ev: ev, heavy: hv });
      }
    }
    return result;
  }

  function parseDetailXml(text) {
    var parser = new DOMParser();
    var doc = parser.parseFromString(text, 'text/xml');
    var items = doc.getElementsByTagName('carparkInfo');
    if (!items.length) items = doc.getElementsByTagName('CarParkInfo');
    var result = [];
    for (var i = 0; i < items.length; i++) {
      var el = items[i];
      var no      = getVal(el, ['CAR_PARK_NO','car_park_no','NO']);
      var cname   = getVal(el, ['CNAME','cname','Title','name']);
      var addr    = getVal(el, ['ADDRESS_C','address_c','ADDRESS','address']);
      var phone   = getVal(el, ['PHONE','phone','TEL','tel']);
      var lat     = toFloat(getVal(el, ['LATITUDE','latitude','LAT','lat']));
      var lng     = toFloat(getVal(el, ['LONGITUDE','longitude','LNG','lng']));
      var tLight  = toInt(getVal(el, ['TOTAL_CAR','total_car','CAR_CAPACITY','TOTAL_LIGHT']));
      var tMoto   = toInt(getVal(el, ['TOTAL_MOTO','total_moto','MOTO_CAPACITY']));
      var tEv     = toInt(getVal(el, ['TOTAL_EV','total_ev','EV_CAPACITY']));
      var tHeavy  = toInt(getVal(el, ['TOTAL_HEAVY','total_heavy','HEAVY_CAPACITY']));
      if (cname && lat && lng) {
        result.push({ id: no, name: cname, address: addr, phone: phone,
          lat: lat, lng: lng,
          capacity: { light: tLight, moto: tMoto, ev: tEv, heavy: tHeavy } });
      }
    }
    return result;
  }

  /* ─── CORS-Proxy Fetch ─── */
  function timedFetch(url, opts, timeout) {
    return new Promise(function(resolve, reject) {
      var done = false;
      var tid = setTimeout(function() {
        if (!done) { done = true; reject(new Error('timeout:' + url)); }
      }, timeout);
      fetch(url, opts || {})
        .then(function(r) {
          if (!done) { done = true; clearTimeout(tid); resolve(r); }
        })
        .catch(function(e) {
          if (!done) { done = true; clearTimeout(tid); reject(e); }
        });
    });
  }

  function fetchViaProxies(path) {
    var targetUrl = API_BASE + path;
    var auth = APPCODE;

    function getText(r) {
      if (!r.ok) return Promise.reject(new Error('HTTP_' + r.status));
      return r.text();
    }

    /* Strategy 1: direct (works if server has CORS + proper headers) */
    function tryDirect() {
      return timedFetch(targetUrl, { headers: { 'Authorization': auth } }, FETCH_TIMEOUT)
        .then(getText);
    }

    /* Strategy 2: corsproxy.io — forwards all request headers to target */
    function tryCorsproxy() {
      return timedFetch(
        'https://corsproxy.io/?' + encodeURIComponent(targetUrl),
        { headers: { 'Authorization': auth } },
        FETCH_TIMEOUT
      ).then(getText);
    }

    /* Strategy 3: corsproxy.io with x-cors-headers meta-header format */
    function tryCorsproxyAlt() {
      return timedFetch(
        'https://corsproxy.io/?' + encodeURIComponent(targetUrl),
        { headers: { 'x-cors-headers': '{"Authorization":"' + auth + '"}' } },
        FETCH_TIMEOUT
      ).then(getText);
    }

    /* Strategy 4: cors.bridged.cc */
    function tryBridged() {
      return timedFetch(
        'https://cors.bridged.cc/' + targetUrl,
        { headers: { 'Authorization': auth, 'x-cors-grida-api-key': 'temp' } },
        FETCH_TIMEOUT
      ).then(getText);
    }

    /* Strategy 5: thingproxy */
    function tryThingproxy() {
      return timedFetch(
        'https://thingproxy.freeboard.io/fetch/' + targetUrl,
        { headers: { 'Authorization': auth } },
        FETCH_TIMEOUT
      ).then(getText);
    }

    /* Strategy 6: allorigins — no auth, last resort (may get 401/403 response) */
    function tryAllOrigins() {
      return timedFetch(
        'https://api.allorigins.win/get?url=' + encodeURIComponent(targetUrl),
        {},
        FETCH_TIMEOUT
      ).then(function(r) { return r.json(); })
       .then(function(j) {
         if (!j || !j.contents) return Promise.reject(new Error('allorigins empty'));
         if (j.contents.indexOf('<') === -1) return Promise.reject(new Error('allorigins no xml'));
         return j.contents;
       });
    }

    var steps = [tryDirect, tryCorsproxy, tryCorsproxyAlt, tryBridged, tryThingproxy, tryAllOrigins];
    var lastErr = '';
    function run(i) {
      if (i >= steps.length) return Promise.reject(new Error('all_failed: ' + lastErr));
      return steps[i]().catch(function(e) {
        lastErr = (e && e.message) || String(e);
        console.warn('[Proxy strategy ' + i + ' failed]', lastErr);
        return run(i + 1);
      });
    }
    return run(0);
  }

  /* ─── localStorage helpers ─── */
  function loadStoredBase() {
    try {
      var raw = localStorage.getItem(LS_BASE_KEY);
      if (raw) return JSON.parse(raw);
    } catch(e) {}
    return null;
  }

  function saveStoredBase(data) {
    try {
      localStorage.setItem(LS_BASE_KEY, JSON.stringify(data));
      localStorage.setItem(LS_BASE_TS, new Date().toISOString());
    } catch(e) {}
  }

  function loadBaseSyncTs() {
    try { return localStorage.getItem(LS_BASE_TS) || null; } catch(e) { return null; }
  }

  function clearStoredBase() {
    try {
      localStorage.removeItem(LS_BASE_KEY);
      localStorage.removeItem(LS_BASE_TS);
    } catch(e) {}
  }

  /* ─── Merge base + realtime ─── */
  function mergeParks(baseList, realtimeArr) {
    var rtMap = {};
    for (var i = 0; i < realtimeArr.length; i++) {
      var r = realtimeArr[i];
      if (r.no) rtMap[String(r.no)] = r;
    }

    return baseList.map(function(park) {
      var rt = rtMap[String(park.id)];
      if (!rt) {
        for (var k = 0; k < realtimeArr.length; k++) {
          var rr = realtimeArr[k];
          if (rr.name && (rr.name.indexOf(park.name) !== -1 || park.name.indexOf(rr.name) !== -1)) {
            rt = rr;
            break;
          }
        }
      }
      var spaces = rt ? { light: rt.light, moto: rt.moto, ev: rt.ev, heavy: rt.heavy }
                      : null;
      var fi = feeInfo();
      return Object.assign({}, park, {
        spaces: spaces,
        hasRealtime: !!rt,
        currentFee: fi.fee,
        feeLabel: fi.label
      });
    });
  }

  /* ─── Main App ─── */
  function App() {
    var storedTs = loadBaseSyncTs();
    var syncOld = storedTs && (Date.now() - new Date(storedTs).getTime() > HALF_YEAR_MS);

    var [parksBase, setParksBase]             = useState(loadStoredBase() || BUILTIN_DB);
    var [realtimeArr, setRealtimeArr]         = useState([]);
    var [connStatus, setConnStatus]           = useState('init'); // 'init'|'ok'|'delayed'|'error'
    var [lastRtTs, setLastRtTs]               = useState(null);
    var [rtLoading, setRtLoading]             = useState(false);
    var [userLocation, setUserLocation]       = useState(null);
    var [locationLabel, setLocationLabel]     = useState('');
    var [radius, setRadius]                   = useState(1000);
    var [vehicleType, setVehicleType]         = useState('light');
    var [selectedRegion, setSelectedRegion]   = useState('全部');
    var [sortBy, setSortBy]                   = useState('spaces');
    var [activeNavId, setActiveNavId]         = useState(null);
    var [gpsError, setGpsError]               = useState(null);
    var [searchText, setSearchText]           = useState('');
    var [suggestions, setSuggestions]         = useState([]);
    var [showSugg, setShowSugg]               = useState(false);
    var [searchLoading, setSearchLoading]     = useState(false);
    var [showSettings, setShowSettings]       = useState(false);
    var [baseSyncLoading, setBaseSyncLoading] = useState(false);
    var [baseSyncMsg, setBaseSyncMsg]         = useState('');
    var [lastBaseSync, setLastBaseSync]       = useState(storedTs);
    var [syncReminder, setSyncReminder]       = useState(syncOld);
    var lastRtTsRef = useRef(null);
    lastRtTsRef.current = lastRtTs;

    /* fetch realtime spaces */
    var fetchRealtime = useCallback(function(isBackground) {
      if (!isBackground) setRtLoading(true);
      return fetchViaProxies('/car_park_maintance')
        .then(function(text) {
          var arr = parseMaintenanceXml(text);
          if (arr.length === 0) return Promise.reject(new Error('empty response'));
          setRealtimeArr(arr);
          var now = new Date();
          setLastRtTs(now);
          setConnStatus('ok');
        })
        .catch(function() {
          var prev = lastRtTsRef.current;
          if (prev && (Date.now() - prev.getTime()) < 120000) {
            setConnStatus('delayed');
          } else {
            setConnStatus('error');
          }
        })
        .then(function() {
          if (!isBackground) setRtLoading(false);
        });
    }, []);

    /* sync base data from detail API */
    var syncBaseData = useCallback(function() {
      setBaseSyncLoading(true);
      setBaseSyncMsg('');
      return fetchViaProxies('/car_park_detail')
        .then(function(text) {
          var parsed = parseDetailXml(text);
          if (parsed.length === 0) return Promise.reject(new Error('empty'));
          var merged = BUILTIN_DB.map(function(b) {
            var remote = null;
            for (var i = 0; i < parsed.length; i++) {
              var p = parsed[i];
              if ((p.id && String(p.id) === String(b.id)) ||
                  (p.name && (p.name.indexOf(b.name) !== -1 || b.name.indexOf(p.name) !== -1))) {
                remote = p;
                break;
              }
            }
            if (!remote) return b;
            return Object.assign({}, b, {
              name:    remote.name    || b.name,
              address: remote.address || b.address,
              phone:   remote.phone   || b.phone,
              lat:     remote.lat     || b.lat,
              lng:     remote.lng     || b.lng,
              capacity: {
                light: remote.capacity.light || b.capacity.light,
                moto:  remote.capacity.moto  || b.capacity.moto,
                ev:    remote.capacity.ev    || b.capacity.ev,
                heavy: remote.capacity.heavy || b.capacity.heavy
              }
            });
          });
          saveStoredBase(merged);
          setParksBase(merged);
          var ts = new Date().toISOString();
          setLastBaseSync(ts);
          setSyncReminder(false);
          setBaseSyncMsg('同步成功！已更新 ' + parsed.length + ' 個停車場資料。');
        })
        .catch(function(e) {
          setBaseSyncMsg('同步失敗：' + (e && e.message ? e.message : '網絡錯誤，請稍後再試'));
        })
        .then(function() {
          setBaseSyncLoading(false);
        });
    }, []);

    /* factory reset */
    var factoryReset = useCallback(function() {
      if (!window.confirm('確定要恢復出廠設定？這將清除所有同步的停車場資料。')) return;
      clearStoredBase();
      setParksBase(BUILTIN_DB);
      setLastBaseSync(null);
      setSyncReminder(false);
      setBaseSyncMsg('已恢復出廠設定。');
    }, []);

    /* on mount: initial realtime fetch + interval */
    useEffect(function() {
      fetchRealtime(false);
      var timer = setInterval(function() { fetchRealtime(true); }, REALTIME_INTERVAL);
      return function() { clearInterval(timer); };
    }, [fetchRealtime]);

    /* search autocomplete */
    var handleSearchInput = useCallback(function(val) {
      setSearchText(val);
      if (val.length < 2) {
        setSuggestions([]);
        setShowSugg(false);
        return;
      }
      var lower = val.toLowerCase();
      var matches = parksBase.filter(function(p) {
        return p.name.toLowerCase().indexOf(lower) !== -1;
      }).slice(0, 5);
      setSuggestions(matches);
      setShowSugg(matches.length > 0);
    }, [parksBase]);

    var handleSuggClick = useCallback(function(park) {
      setSearchText(park.name);
      setSuggestions([]);
      setShowSugg(false);
      setUserLocation({ lat: park.lat, lng: park.lng });
      setLocationLabel('搜尋：' + park.name);
      setSelectedRegion('全部');
      setRadius(Infinity);
    }, []);

    var handleSearchSubmit = useCallback(function() {
      setShowSugg(false);
      if (!searchText.trim()) return;
      var lower = searchText.toLowerCase();
      var exact = parksBase.find(function(p) {
        return p.name.toLowerCase().indexOf(lower) !== -1;
      });
      if (exact) {
        handleSuggClick(exact);
        return;
      }
      setSearchLoading(true);
      var nomUrl = 'https://nominatim.openstreetmap.org/search?q=' +
        encodeURIComponent(searchText + ' 澳門') +
        '&format=json&limit=1&countrycodes=mo';
      fetch(nomUrl, { headers: { 'Accept-Language': 'zh' } })
        .then(function(r) { return r.json(); })
        .then(function(data) {
          if (data && data.length > 0) {
            var item = data[0];
            setUserLocation({ lat: parseFloat(item.lat), lng: parseFloat(item.lon) });
            setLocationLabel('地標：' + (item.display_name.split(',')[0] || searchText));
            setSelectedRegion('全部');
            setRadius(1000);
          }
        })
        .catch(function() {})
        .then(function() { setSearchLoading(false); });
    }, [searchText, parksBase, handleSuggClick]);

    /* GPS */
    var handleFindParking = useCallback(function() {
      if (!navigator.geolocation) {
        setGpsError('您的瀏覽器不支援地理位置功能。');
        return;
      }
      setGpsError(null);
      setSelectedRegion('全部');
      navigator.geolocation.getCurrentPosition(
        function(pos) {
          setUserLocation({ lat: pos.coords.latitude, lng: pos.coords.longitude });
          setLocationLabel('我的位置');
          setRadius(1000);
          setSortBy('distance');
        },
        function() { setGpsError('無法獲取您的位置，請允許瀏覽器存取定位權限。'); },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
      );
    }, []);

    var handleMockLocation = useCallback(function() {
      setSelectedRegion('全部');
      setUserLocation({ lat: 22.194500, lng: 113.538500 });
      setLocationLabel('模擬：新馬路');
      setRadius(1000);
      setSortBy('distance');
    }, []);

    /* displayed list */
    var mergedParks = useMemo(function() {
      return mergeParks(parksBase, realtimeArr);
    }, [parksBase, realtimeArr]);

    var displayedParks = useMemo(function() {
      var fi = feeInfo();
      var list = mergedParks.map(function(p) {
        var dist = userLocation
          ? Math.round(calcDistance(userLocation.lat, userLocation.lng, p.lat, p.lng))
          : null;
        return Object.assign({}, p, { distance: dist, currentFee: fi.fee, feeLabel: fi.label });
      });

      if (selectedRegion !== '全部') {
        list = list.filter(function(p) { return p.region === selectedRegion; });
      }
      if (userLocation && radius !== Infinity) {
        list = list.filter(function(p) { return p.distance !== null && p.distance <= radius; });
      }

      list.sort(function(a, b) {
        var aOff = !a.hasRealtime, bOff = !b.hasRealtime;
        if (aOff && !bOff) return 1;
        if (!aOff && bOff) return -1;

        var aS = getVehicleSpaces(a, vehicleType);
        var bS = getVehicleSpaces(b, vehicleType);
        var aFull = aS === 0, bFull = bS === 0;
        if (aFull && !bFull) return 1;
        if (!aFull && bFull) return -1;

        if (sortBy === 'distance' && a.distance !== null && b.distance !== null) {
          return a.distance - b.distance;
        }
        if (sortBy === 'spaces') return bS - aS;
        if (sortBy === 'fee') return a.currentFee - b.currentFee;
        return bS - aS;
      });
      return list;
    }, [mergedParks, userLocation, radius, selectedRegion, vehicleType, sortBy]);

    /* region stats */
    var regionStats = useMemo(function() {
      var pool = selectedRegion === '全部' ? mergedParks
        : mergedParks.filter(function(p) { return p.region === selectedRegion; });
      var st = { light:{a:0,t:0}, moto:{a:0,t:0}, ev:{a:0,t:0}, heavy:{a:0,t:0} };
      pool.forEach(function(p) {
        var cap = p.capacity || {};
        st.light.t  += (cap.light  || 0);  st.light.a  += (p.spaces ? (p.spaces.light  || 0) : 0);
        st.moto.t   += (cap.moto   || 0);  st.moto.a   += (p.spaces ? (p.spaces.moto   || 0) : 0);
        st.ev.t     += (cap.ev     || 0);  st.ev.a     += (p.spaces ? (p.spaces.ev     || 0) : 0);
        st.heavy.t  += (cap.heavy  || 0);  st.heavy.a  += (p.spaces ? (p.spaces.heavy  || 0) : 0);
      });
      return { count: pool.length, st: st };
    }, [mergedParks, selectedRegion]);

    function getVehicleSpaces(park, type) {
      if (!park.spaces) return 0;
      if (type === 'light') return park.spaces.light;
      if (type === 'moto')  return park.spaces.moto;
      if (type === 'ev')    return park.spaces.ev;
      return park.spaces.light + park.spaces.moto + park.spaces.ev + park.spaces.heavy;
    }

    function openMap(type, lat, lng, name) {
      var url = '';
      if (type === 'google') url = 'https://www.google.com/maps/dir/?api=1&destination=' + lat + ',' + lng;
      else if (type === 'apple') url = 'http://maps.apple.com/?daddr=' + lat + ',' + lng;
      else if (type === 'amap') url = 'https://uri.amap.com/navigation?to=' + lng + ',' + lat + ',' + encodeURIComponent(name) + '&mode=car';
      window.open(url, '_blank');
    }

    function connBadge() {
      if (connStatus === 'ok') return { cls:'bg-green-100 text-green-800', text:'官方數據已接通' };
      if (connStatus === 'delayed') return { cls:'bg-orange-100 text-orange-800', text:'數據連接延遲' };
      if (connStatus === 'error') return { cls:'bg-red-100 text-red-800', text:'未能讀取數據' };
      return { cls:'bg-gray-100 text-gray-600', text:'連接中…' };
    }

    function spaceColor(count, type) {
      if (count === null || count === undefined) return 'text-gray-400';
      if (count === 0) return 'text-red-600 font-bold pulse-red';
      if (count <= 10) return 'text-orange-500 font-bold';
      return 'text-emerald-600 font-bold';
    }

    var badge = connBadge();
    var fmtTs = function(ts) {
      if (!ts) return '';
      try {
        var d = new Date(ts);
        return d.toLocaleDateString('zh-MO') + ' ' + d.toLocaleTimeString('zh-MO', {hour:'2-digit',minute:'2-digit'});
      } catch(e) { return ts; }
    };

    /* ──────────────── RENDER ──────────────── */
    return (
      <div className="min-h-screen bg-gray-100 flex justify-center">
        <div className="w-full max-w-md bg-white shadow-2xl flex flex-col relative" style={{minHeight:'100vh'}}>

          {/* ── Header ── */}
          <div className="bg-emerald-600 text-white px-5 pt-5 pb-4 shadow-lg z-20">
            <div className="flex items-center justify-between mb-1">
              <div className="flex items-center space-x-2">
                <i className="fa-solid fa-square-parking text-2xl"></i>
                <h1 className="text-xl font-bold tracking-wide">澳門找車位</h1>
                <span className="text-[11px] bg-emerald-700 px-2 py-0.5 rounded-full opacity-80">小助手</span>
              </div>
              <div className="flex items-center space-x-2">
                <span className={'text-[10px] px-2 py-1 rounded-full font-semibold ' + badge.cls}>
                  {connStatus === 'ok' || connStatus === 'delayed'
                    ? <span><i className="fa-solid fa-circle-dot mr-1 text-[8px]"></i>{badge.text}</span>
                    : badge.text}
                </span>
                <button onClick={function(){ setShowSettings(!showSettings); }}
                  className="w-8 h-8 rounded-full bg-emerald-700 hover:bg-emerald-800 flex items-center justify-center transition-colors">
                  <i className="fa-solid fa-gear text-sm"></i>
                </button>
              </div>
            </div>
            <div className="flex items-center justify-between">
              <p className="text-emerald-200 text-xs">全澳 {parksBase.length} 個公共停車場</p>
              <div className="flex items-center space-x-2">
                {lastRtTs ? (
                  <p className="text-emerald-300 text-[10px]">
                    更新：{lastRtTs.toLocaleTimeString('zh-MO', {hour:'2-digit',minute:'2-digit',second:'2-digit'})}
                  </p>
                ) : (
                  <p className="text-emerald-300 text-[10px]">尚未取得數據</p>
                )}
                <button
                  onClick={function(){ fetchRealtime(false); }}
                  disabled={rtLoading}
                  className="text-emerald-300 hover:text-white disabled:opacity-40 transition-colors"
                  title="立即重新整合數據">
                  <i className={'fa-solid fa-rotate text-xs' + (rtLoading ? ' spin' : '')}></i>
                </button>
              </div>
            </div>
          </div>

          {/* ── Settings Panel ── */}
          {showSettings && (
            <div className="bg-slate-800 text-white px-5 py-4 border-b border-slate-700 z-10">
              <h2 className="font-bold text-sm mb-3 flex items-center space-x-2">
                <i className="fa-solid fa-sliders"></i>
                <span>系統設定</span>
              </h2>

              {syncReminder && (
                <div className="mb-3 p-2 bg-yellow-600 rounded text-xs flex items-start space-x-2">
                  <i className="fa-solid fa-triangle-exclamation mt-0.5"></i>
                  <span>停車場基礎資料已超過半年未更新，建議重新同步。</span>
                </div>
              )}

              <div className="bg-slate-700 rounded-lg p-3 mb-3">
                <div className="text-xs font-semibold text-slate-300 mb-2">停車場基礎資料同步</div>
                <div className="text-[10px] text-slate-400 mb-2">
                  從交通局 API 更新停車場名稱、位置、地址及總容量。<br/>
                  一般半年更新一次即可。
                </div>
                {lastBaseSync && (
                  <div className="text-[10px] text-slate-400 mb-2">
                    上次同步：{fmtTs(lastBaseSync)}
                  </div>
                )}
                <button
                  onClick={syncBaseData}
                  disabled={baseSyncLoading}
                  className="w-full py-2 bg-emerald-600 hover:bg-emerald-500 rounded-lg text-sm font-medium transition-colors disabled:opacity-60 flex items-center justify-center space-x-2"
                >
                  {baseSyncLoading
                    ? <span><i className="fa-solid fa-rotate spin mr-2"></i>同步中…</span>
                    : <span><i className="fa-solid fa-cloud-arrow-down mr-2"></i>立即同步基礎資料</span>}
                </button>
                {baseSyncMsg && (
                  <div className={'mt-2 text-xs px-2 py-1 rounded ' +
                    (baseSyncMsg.indexOf('成功') !== -1 ? 'bg-green-800 text-green-200' : 'bg-red-800 text-red-200')}>
                    {baseSyncMsg}
                  </div>
                )}
              </div>

              <div className="bg-slate-700 rounded-lg p-3">
                <div className="text-xs font-semibold text-slate-300 mb-1">恢復出廠設定</div>
                <div className="text-[10px] text-slate-400 mb-2">清除所有同步資料，恢復程式內建 {BUILTIN_DB.length} 個停車場記錄。</div>
                <button
                  onClick={factoryReset}
                  className="w-full py-2 bg-red-700 hover:bg-red-600 rounded-lg text-sm font-medium transition-colors flex items-center justify-center space-x-2"
                >
                  <i className="fa-solid fa-rotate-left mr-2"></i>恢復出廠設定
                </button>
              </div>
            </div>
          )}

          {/* ── Control Panel ── */}
          <div className="px-4 pt-4 pb-3 border-b border-gray-100 bg-white">

            {/* Search box */}
            <div className="relative mb-4">
              <div className="flex items-center border border-gray-300 rounded-xl overflow-hidden shadow-sm focus-within:ring-2 focus-within:ring-emerald-400 focus-within:border-emerald-400">
                <i className="fa-solid fa-magnifying-glass text-gray-400 ml-3"></i>
                <input
                  type="text"
                  value={searchText}
                  onChange={function(e){ handleSearchInput(e.target.value); }}
                  onKeyDown={function(e){ if(e.key==='Enter') handleSearchSubmit(); }}
                  onFocus={function(){ if(suggestions.length>0) setShowSugg(true); }}
                  placeholder="搜尋停車場或地標…"
                  className="flex-1 py-2.5 px-3 text-sm outline-none bg-transparent"
                />
                {searchLoading
                  ? <i className="fa-solid fa-rotate spin text-emerald-500 mr-3"></i>
                  : searchText
                    ? <button onClick={function(){setSearchText('');setSuggestions([]);setShowSugg(false);}}
                        className="mr-3 text-gray-400 hover:text-gray-600">
                        <i className="fa-solid fa-xmark"></i>
                      </button>
                    : null}
                <button onClick={handleSearchSubmit}
                  className="bg-emerald-600 text-white px-3 py-2.5 text-sm hover:bg-emerald-700 transition-colors">
                  搜尋
                </button>
              </div>
              {showSugg && suggestions.length > 0 && (
                <div className="absolute left-0 right-0 top-full mt-1 bg-white border border-gray-200 rounded-xl shadow-xl z-50 overflow-hidden">
                  {suggestions.map(function(s) {
                    return (
                      <button key={s.id} onClick={function(){ handleSuggClick(s); }}
                        className="w-full text-left px-4 py-2.5 hover:bg-emerald-50 text-sm border-b border-gray-100 last:border-0 flex items-center space-x-2">
                        <i className="fa-solid fa-square-parking text-emerald-500 text-xs"></i>
                        <span className="flex-1">{s.name}</span>
                        <span className="text-[10px] text-gray-400">{s.region}</span>
                      </button>
                    );
                  })}
                </div>
              )}
            </div>

            {/* GPS button */}
            <button onClick={handleFindParking}
              className="w-full flex items-center justify-center space-x-3 bg-emerald-500 text-white py-3 px-4 rounded-2xl shadow-md shadow-emerald-200 hover:bg-emerald-600 active:scale-95 transition-all mb-4">
              <i className="fa-solid fa-location-crosshairs text-2xl"></i>
              <div className="text-left">
                <div className="font-bold text-lg tracking-wider">搵 車 位</div>
                <div className="text-[11px] opacity-80">以手機定位找附近停車場</div>
              </div>
              {userLocation && (
                <div className="ml-auto bg-emerald-600 rounded-lg px-2 py-1 text-xs">
                  <i className="fa-solid fa-location-dot mr-1"></i>{locationLabel || '已定位'}
                </div>
              )}
            </button>

            {/* GPS error */}
            {gpsError && (
              <div className="mb-3 p-2.5 bg-red-50 text-red-600 rounded-lg text-sm flex items-start space-x-2">
                <i className="fa-solid fa-triangle-exclamation mt-0.5 shrink-0"></i>
                <span>{gpsError}</span>
              </div>
            )}

            {/* Region filter */}
            <div className="mb-3">
              <label className="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2">區域查詢</label>
              <div className="flex flex-wrap gap-1.5">
                {REGIONS.map(function(reg) {
                  return (
                    <button key={reg} onClick={function(){ setSelectedRegion(reg); }}
                      className={'py-1 px-2.5 text-xs rounded-full border transition-colors ' +
                        (selectedRegion === reg
                          ? 'bg-emerald-600 text-white border-emerald-600 font-semibold shadow-sm'
                          : 'bg-white text-gray-600 border-gray-200 hover:bg-gray-50')}>
                      {reg}
                    </button>
                  );
                })}
              </div>
            </div>

            {/* Vehicle type */}
            <div className="mb-3">
              <label className="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2">車輛類型</label>
              <div className="grid grid-cols-3 gap-2">
                {[
                  { id:'light', label:'輕型車',  icon:'fa-car' },
                  { id:'ev',    label:'電動車',  icon:'fa-bolt' },
                  { id:'moto',  label:'電單車',  icon:'fa-motorcycle' }
                ].map(function(v) {
                  return (
                    <button key={v.id} onClick={function(){ setVehicleType(v.id); }}
                      className={'py-2 text-sm rounded-xl border transition-colors flex flex-col items-center space-y-1 ' +
                        (vehicleType === v.id
                          ? 'bg-blue-50 border-blue-400 text-blue-700 font-bold shadow-sm'
                          : 'bg-white border-gray-200 text-gray-600 hover:bg-gray-50')}>
                      <i className={'fa-solid ' + v.icon + ' text-base'}></i>
                      <span className="text-xs">{v.label}</span>
                    </button>
                  );
                })}
              </div>
            </div>

            {/* Radius (only when location set) */}
            {userLocation && (
              <div className="mb-3">
                <label className="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2">搜尋範圍</label>
                <div className="grid grid-cols-5 gap-1">
                  {[{v:500,l:'500m'},{v:1000,l:'1km'},{v:2000,l:'2km'},{v:3000,l:'3km'},{v:Infinity,l:'全部'}].map(function(r) {
                    return (
                      <button key={r.v} onClick={function(){ setRadius(r.v); }}
                        className={'py-1.5 text-[11px] rounded-lg transition-colors ' +
                          (radius === r.v ? 'bg-gray-800 text-white font-medium' : 'bg-gray-100 text-gray-600 hover:bg-gray-200')}>
                        {r.l}
                      </button>
                    );
                  })}
                </div>
              </div>
            )}

            {/* Sort */}
            <div>
              <label className="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2">排序方式</label>
              <div className="grid grid-cols-3 gap-2">
                {[{id:'distance',l:'距離最近'},{id:'spaces',l:'車位最多'},{id:'fee',l:'收費最低'}].map(function(s) {
                  return (
                    <button key={s.id} onClick={function(){ setSortBy(s.id); }}
                      className={'py-2 text-xs rounded-xl border transition-colors ' +
                        (sortBy === s.id
                          ? 'bg-emerald-50 border-emerald-500 text-emerald-700 font-bold'
                          : 'bg-white border-gray-200 text-gray-600 hover:bg-gray-50')}>
                      {s.l}
                    </button>
                  );
                })}
              </div>
            </div>
          </div>

          {/* ── Region Stats Bar ── */}
          <div className="bg-emerald-50 px-4 py-2.5 border-b border-emerald-100">
            <div className="flex justify-between items-center mb-1.5">
              <span className="text-xs font-bold text-emerald-800">{selectedRegion} ({regionStats.count}個停車場)</span>
              <span className="text-[10px] text-emerald-600">空置 / 總數</span>
            </div>
            <div className="grid grid-cols-4 gap-1.5">
              {[
                {key:'light', icon:'fa-car',        color:'text-blue-500',   label:'輕型', sel:'light'},
                {key:'ev',    icon:'fa-bolt',        color:'text-green-500',  label:'電動', sel:'ev'},
                {key:'moto',  icon:'fa-motorcycle',  color:'text-orange-500', label:'電單車', sel:'moto'},
                {key:'heavy', icon:'fa-truck',       color:'text-slate-500',  label:'重型', sel:'all'}
              ].map(function(item) {
                var st = regionStats.st[item.key];
                var active = vehicleType === item.sel;
                return (
                  <div key={item.key}
                    className={'bg-white rounded-lg p-1.5 text-center shadow-sm border ' +
                      (active ? 'border-blue-400 ring-1 ring-blue-300' : 'border-emerald-100')}>
                    <i className={'fa-solid ' + item.icon + ' ' + item.color + ' text-xs mb-0.5'}></i>
                    <div className="text-[9px] text-gray-400">{item.label}</div>
                    <div className="text-xs font-bold text-gray-800">
                      <span className={spaceColor(st.a, item.sel)}>{st.a}</span>
                      <span className="text-[9px] text-gray-400 font-normal">/{st.t}</span>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>

          {/* ── Park List ── */}
          <div className="flex-1 overflow-y-auto bg-gray-50 pb-20">
            <div className="px-4 py-2 flex justify-between items-center">
              <span className="text-xs text-gray-500">
                {userLocation && radius !== Infinity
                  ? '找到 ' + displayedParks.length + ' 個停車場'
                  : '列出 ' + displayedParks.length + ' 個停車場'}
              </span>
              {realtimeArr.length > 0 && (
                <span className="text-[10px] text-gray-400">
                  <i className="fa-solid fa-satellite-dish mr-1"></i>
                  即時數據：{realtimeArr.length}個
                </span>
              )}
            </div>

            <div className="px-4 space-y-3 pb-4">
              {displayedParks.map(function(park) {
                var vs = getVehicleSpaces(park, vehicleType);
                var isFull = vs === 0;
                var noData = !park.spaces;
                var navOpen = activeNavId === park.id;
                var fi2 = feeInfo();

                return (
                  <div key={park.id}
                    className={'bg-white rounded-2xl shadow-sm border overflow-hidden ' +
                      (isFull && !noData ? 'border-red-200' : 'border-gray-100')}>

                    {/* Card header */}
                    <div className={'px-4 pt-3 pb-2 flex items-start justify-between ' +
                      (isFull && !noData ? 'bg-red-50' : '')}>
                      <div className="flex-1 pr-2">
                        <h3 className="font-bold text-gray-800 text-base leading-snug">
                          {park.name}
                          {isFull && !noData && (
                            <span className="ml-2 align-middle text-[10px] bg-red-100 text-red-600 px-2 py-0.5 rounded-full pulse-red">已滿</span>
                          )}
                          {noData && (
                            <span className="ml-2 align-middle text-[10px] bg-gray-100 text-gray-400 px-2 py-0.5 rounded-full">離線</span>
                          )}
                        </h3>
                        <div className="text-[11px] text-gray-400 mt-0.5">
                          <i className="fa-solid fa-map-pin mr-1 text-emerald-500"></i>{park.region}
                        </div>
                      </div>
                      {park.distance !== null && (
                        <div className="bg-emerald-100 text-emerald-700 text-xs font-bold px-2.5 py-1 rounded-full shrink-0">
                          {park.distance < 1000
                            ? park.distance + 'm'
                            : (park.distance / 1000).toFixed(1) + 'km'}
                        </div>
                      )}
                    </div>

                    {/* Spaces */}
                    <div className="px-4 pb-2">
                      {noData && (
                        <div className="text-[10px] text-orange-500 mb-1.5 flex items-center space-x-1">
                          <i className="fa-solid fa-triangle-exclamation"></i>
                          <span>即時車位數據未能讀取，顯示停車場總容量</span>
                        </div>
                      )}
                      <div className="grid grid-cols-4 gap-1.5">
                        {[
                          { key:'light', icon:'fa-car',        label:'輕型',  avail: park.spaces ? park.spaces.light  : null, cap: park.capacity ? (park.capacity.light  || 0) : 0, sel:'light', ring:'ring-blue-300' },
                          { key:'ev',    icon:'fa-bolt',       label:'電動',  avail: park.spaces ? park.spaces.ev     : null, cap: park.capacity ? (park.capacity.ev     || 0) : 0, sel:'ev',    ring:'ring-green-300' },
                          { key:'moto',  icon:'fa-motorcycle', label:'電單車', avail: park.spaces ? park.spaces.moto   : null, cap: park.capacity ? (park.capacity.moto   || 0) : 0, sel:'moto',  ring:'ring-orange-300' },
                          { key:'heavy', icon:'fa-truck',      label:'重型',  avail: park.spaces ? park.spaces.heavy  : null, cap: park.capacity ? (park.capacity.heavy  || 0) : 0, sel:'all',   ring:'ring-slate-300' }
                        ].map(function(item) {
                          var active = vehicleType === item.sel;
                          var hasAvail = item.avail !== null;
                          return (
                            <div key={item.key}
                              className={'rounded-lg p-1.5 text-center border ' +
                                (active ? 'bg-blue-50 border-blue-300 ring-1 ' + item.ring : 'bg-gray-50 border-gray-100')}>
                              <i className={'fa-solid ' + item.icon + ' text-gray-400 text-[10px]'}></i>
                              <div className="text-[9px] text-gray-400">{item.label}</div>
                              {hasAvail ? (
                                <div>
                                  <span className={'text-sm ' + spaceColor(item.avail, item.sel)}>{item.avail}</span>
                                  <span className="text-[9px] text-gray-400">/{item.cap}</span>
                                </div>
                              ) : (
                                <div>
                                  <span className="text-xs text-gray-300">---</span>
                                  <span className="text-[9px] text-gray-400">/{item.cap}</span>
                                </div>
                              )}
                            </div>
                          );
                        })}
                      </div>
                    </div>

                    {/* Info */}
                    <div className="mx-4 mb-2 bg-gray-50 rounded-xl p-2.5 text-xs text-gray-600 space-y-1">
                      <div className="flex items-center justify-between">
                        <span className="flex items-center space-x-1">
                          <i className="fa-solid fa-dollar-sign text-emerald-600"></i>
                          <span>現時收費</span>
                          <span className="text-[10px] text-gray-400">({fi2.label})</span>
                        </span>
                        <span className="font-bold text-emerald-700 text-base">${fi2.fee}<span className="text-[10px] font-normal text-gray-500">/小時</span></span>
                      </div>
                      <div className="flex items-center space-x-1 text-[11px]">
                        <i className="fa-solid fa-location-dot text-blue-400"></i>
                        <span className="text-gray-500">{park.address}</span>
                      </div>
                      {park.phone && (
                        <div className="flex items-center space-x-1 text-[11px]">
                          <i className="fa-solid fa-phone text-orange-400"></i>
                          <span className="text-gray-500">{park.phone}</span>
                        </div>
                      )}
                    </div>

                    {/* Navigation */}
                    <div className="px-4 pb-3">
                      <button onClick={function(){ setActiveNavId(navOpen ? null : park.id); }}
                        className="w-full flex items-center justify-center space-x-2 py-2 bg-emerald-50 text-emerald-700 rounded-xl text-sm font-medium hover:bg-emerald-100 transition-colors">
                        <i className="fa-solid fa-diamond-turn-right"></i>
                        <span>前往停車場</span>
                        <i className={'fa-solid fa-chevron-' + (navOpen ? 'up' : 'down') + ' text-xs'}></i>
                      </button>
                      {navOpen && (
                        <div className="flex space-x-2 mt-2">
                          <button onClick={function(){ openMap('google', park.lat, park.lng, park.name); }}
                            className="flex-1 py-2.5 bg-blue-50 text-blue-700 rounded-xl text-xs font-semibold hover:bg-blue-100 transition-colors flex flex-col items-center">
                            <i className="fa-brands fa-google mb-0.5"></i>Google Maps
                          </button>
                          <button onClick={function(){ openMap('apple', park.lat, park.lng, park.name); }}
                            className="flex-1 py-2.5 bg-gray-100 text-gray-700 rounded-xl text-xs font-semibold hover:bg-gray-200 transition-colors flex flex-col items-center">
                            <i className="fa-brands fa-apple mb-0.5"></i>Apple Maps
                          </button>
                          <button onClick={function(){ openMap('amap', park.lat, park.lng, park.name); }}
                            className="flex-1 py-2.5 bg-sky-50 text-sky-700 rounded-xl text-xs font-semibold hover:bg-sky-100 transition-colors flex flex-col items-center">
                            <i className="fa-solid fa-map mb-0.5"></i>高德地圖
                          </button>
                        </div>
                      )}
                    </div>
                  </div>
                );
              })}

              {displayedParks.length === 0 && !rtLoading && (
                <div className="text-center text-gray-400 py-16">
                  <i className="fa-solid fa-square-parking text-4xl mb-3 block text-gray-200"></i>
                  <p className="text-sm">無符合條件的停車場</p>
                  <p className="text-xs mt-1">請嘗試調整搜尋範圍或區域篩選</p>
                </div>
              )}
            </div>
          </div>

          {/* ── Mock location FAB ── */}
          <button onClick={handleMockLocation}
            className="fixed bottom-6 right-6 bg-slate-800 text-white p-3 rounded-full shadow-2xl hover:bg-slate-700 active:scale-95 transition-all z-50 border border-slate-600"
            title="模擬身處新馬路 (測試用)">
            <i className="fa-solid fa-desktop"></i>
          </button>

        </div>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
