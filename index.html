                        {hasCap && <span className="text-[9px] text-gray-400">/{item.cap}</span>}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>

            {/* Info */}
            <div className="mx-4 mb-2 bg-gray-50 rounded-xl p-2.5 text-xs text-gray-600 space-y-1">
              <div className="flex items-center justify-between">
                <span className="flex items-center space-x-1">
                  <i className="fa-solid fa-dollar-sign text-emerald-600"></i>
                  <span>現時收費</span>
                  <span className="text-[10px] text-gray-400">({fi2.label})</span>
                </span>
                <span className="font-bold text-emerald-700 text-base">${fi2.fee}<span className="text-[10px] font-normal text-gray-500">/小時</span></span>
              </div>
              <div className="flex items-center space-x-1 text-[11px]">
                <i className="fa-solid fa-location-dot text-blue-400"></i>
                <span className="text-gray-500">{park.address}</span>
              </div>
              {park.phone && (
                <div className="flex items-center space-x-1 text-[11px]">
                  <i className="fa-solid fa-phone text-orange-400"></i>
                  <span className="text-gray-500">{park.phone}</span>
                </div>
              )}
            </div>

            {/* Navigation */}
            <div className="px-4 pb-3">
              <button onClick={function(){ setActiveNavId(navOpen ? null : park.id); }}
                className="w-full flex items-center justify-center space-x-2 py-2 bg-emerald-50 text-emerald-700 rounded-xl text-sm font-medium hover:bg-emerald-100 transition-colors">
                <i className="fa-solid fa-diamond-turn-right"></i>
                <span>前往停車場</span>
                <i className={'fa-solid fa-chevron-' + (navOpen ? 'up' : 'down') + ' text-xs'}></i>
              </button>
              {navOpen && (
                <div className="flex space-x-2 mt-2">
                  <button onClick={function(){ openMap('google', park.lat, park.lng, park.name); }}
                    className="flex-1 py-2.5 bg-blue-50 text-blue-700 rounded-xl text-xs font-semibold hover:bg-blue-100 transition-colors flex flex-col items-center">
                    <i className="fa-brands fa-google mb-0.5"></i>Google Maps
                  </button>
                  <button onClick={function(){ openMap('apple', park.lat, park.lng, park.name); }}
                    className="flex-1 py-2.5 bg-gray-100 text-gray-700 rounded-xl text-xs font-semibold hover:bg-gray-200 transition-colors flex flex-col items-center">
                    <i className="fa-brands fa-apple mb-0.5"></i>Apple Maps
                  </button>
                  <button onClick={function(){ openMap('amap', park.lat, park.lng, park.name); }}
                    className="flex-1 py-2.5 bg-sky-50 text-sky-700 rounded-xl text-xs font-semibold hover:bg-sky-100 transition-colors flex flex-col items-center">
                    <i className="fa-solid fa-map mb-0.5"></i>高德地圖
                  </button>
                </div>
              )}
            </div>
          </div>
        );
    }

    /* displayed list */
    var mergedParks = useMemo(function() {
      return mergeParks(parksBase, realtimeArr);
    }, [parksBase, realtimeArr]);

    var displayedParks = useMemo(function() {
      var fi = feeInfo();
      var list = mergedParks.map(function(p) {
        var dist = userLocation
          ? Math.round(calcDistance(userLocation.lat, userLocation.lng, p.lat, p.lng))
          : null;
        return Object.assign({}, p, { distance: dist, currentFee: fi.fee, feeLabel: fi.label });
      });

      /* A lookup of one carpark answers about that carpark, so neither the
         region nor the radius should be able to filter it away. */
      if (focusParkId !== null) {
        return list.filter(function(p) { return String(p.id) === String(focusParkId); });
      }

      if (selectedRegion !== '全部') {
        list = list.filter(function(p) { return p.region === selectedRegion; });
      }
      if (userLocation && radius !== Infinity) {
        list = list.filter(function(p) { return p.distance !== null && p.distance <= radius; });
      }

      list.sort(parkComparator(sortBy, vehicleType));

      return list;
    }, [mergedParks, userLocation, radius, selectedRegion, vehicleType, sortBy, focusParkId]);

    var focusedPark = useMemo(function() {
      if (focusParkId === null) return null;
      return displayedParks.length ? displayedParks[0] : null;
    }, [displayedParks, focusParkId]);

    /* A carpark whose coordinates the feed did not publish cannot be placed.
       Counting them lets the map say so instead of quietly dropping them. */
    var mappableParks = useMemo(function() {
      return displayedParks.filter(function(p) { return p.lat && p.lng; });
    }, [displayedParks]);
    var unmappableCount = displayedParks.length - mappableParks.length;

    /* ─── Map ─────────────────────────────────────────────────────────
       Leaflet is imperative, so the map lives in refs and this effect
       syncs it with whatever the filters currently show. */
    useEffect(function() {
      if (viewMode !== 'map') return;
      var L = window.L;
      if (!L) {
        setMapError('地圖程式庫載入唔到，可能係網絡問題。可以切返清單檢視。');
        return;
      }
      setMapError('');

      /* Switching to the list unmounts the container, so a map kept from
         last time is bound to a node that is no longer on the page. */
      if (mapRef.current && mapRef.current.getContainer() !== mapElRef.current) {
        mapRef.current.remove();
        mapRef.current = null; layerRef.current = null;
        meRef.current = null; accRef.current = null;
        fitKeyRef.current = '';
      }

      if (!mapRef.current) {
        if (!mapElRef.current) return;
        var m = L.map(mapElRef.current, { zoomControl: true })
                 .setView([22.17, 113.55], 12);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 19,
          attribution: '地圖 © OpenStreetMap 貢獻者｜車位數據 © 澳門交通事務局'
        }).addTo(m);
        mapRef.current = m;
        layerRef.current = L.layerGroup().addTo(m);
      }
      var map = mapRef.current;
      /* The container has just been shown, so Leaflet still thinks it has
         no size. */
      map.invalidateSize();

      layerRef.current.clearLayers();

      mappableParks.forEach(function(park) {
        var n = getVehicleSpaces(park, vehicleType);
        var cap = park.capacity ? park.capacity[vehicleType === 'all' ? 'light' : vehicleType] : null;
        var label = (n === null || n === undefined) ? '?' : String(n);
        var marker = L.marker([park.lat, park.lng], {
          icon: L.divIcon({
            className: 'cp-pin-wrap',
            html: '<div class="cp-pin" style="background:' + pinColor(n, cap) + '">' + label + '</div>',
            iconSize: [34, 23],
            iconAnchor: [17, 11]
          }),
          title: park.name
        });

        marker.bindPopup(function() {
          var box = document.createElement('div');
          var title = document.createElement('div');
          title.style.cssText = 'font-weight:700;margin-bottom:4px';
          title.textContent = park.name;
          box.appendChild(title);

          if (park.address) {
            var ad = document.createElement('div');
            ad.style.cssText = 'color:#6b7280;font-size:11px;margin-bottom:6px';
            ad.textContent = park.address;
            box.appendChild(ad);
          }

          var rows = document.createElement('div');
          rows.style.cssText = 'font-size:12px;margin-bottom:8px';
          [['輕型', 'light'], ['電單車', 'moto'], ['電動', 'ev'], ['重型', 'heavy']].forEach(function(pair) {
            var v = park.spaces ? park.spaces[pair[1]] : null;
            if (v === null || v === undefined) return;
            var r = document.createElement('div');
            r.textContent = pair[0] + '：' + v +
              (typeof (park.capacity || {})[pair[1]] === 'number' ? ' / ' + park.capacity[pair[1]] : '');
            rows.appendChild(r);
          });
          if (!rows.childNodes.length) {
            rows.textContent = '未有即時車位數據';
            rows.style.color = '#9ca3af';
          }
          box.appendChild(rows);

          var bar = document.createElement('div');
          bar.style.cssText = 'display:flex;gap:6px';
          var detail = document.createElement('button');
          detail.textContent = '詳細';
          detail.style.cssText = 'flex:1;padding:5px 8px;border-radius:8px;border:1px solid #d1d5db;background:#fff;font-size:12px;cursor:pointer';
          detail.addEventListener('click', function() {
            setFocusParkId(park.id);
            setViewMode('list');
          });
          var nav = document.createElement('button');
          nav.textContent = '導航';
          nav.style.cssText = 'flex:1;padding:5px 8px;border-radius:8px;border:none;background:#059669;color:#fff;font-size:12px;cursor:pointer';
          nav.addEventListener('click', function() {
            openMap('google', park.lat, park.lng, park.name);
          });
          bar.appendChild(detail); bar.appendChild(nav);
          box.appendChild(bar);
          return box;
        });

        marker.addTo(layerRef.current);
      });

      if (meRef.current) { map.removeLayer(meRef.current); meRef.current = null; }
      if (accRef.current) { map.removeLayer(accRef.current); accRef.current = null; }
      if (userLocation) {
        var label = locationLabel || '我的位置';
        /* How far off the fix might be, drawn rather than left to guess. */
        if (userAccuracy && userAccuracy > 20 && L.circle) {
          accRef.current = L.circle([userLocation.lat, userLocation.lng], {
            radius: userAccuracy, color: '#2563eb', weight: 1,
            fillColor: '#2563eb', fillOpacity: 0.08
          }).addTo(map);
        }
        meRef.current = L.marker([userLocation.lat, userLocation.lng], {
          icon: L.divIcon({ className: 'cp-pin-wrap', html: '<div class="cp-me"></div>',
                            iconSize: [16, 16], iconAnchor: [8, 8] }),
          title: label, zIndexOffset: 1000
        }).addTo(map);
        /* A permanent tooltip puts the place name on the map itself, so the
           blue dot does not need to be tapped to know what it is. */
        if (meRef.current.bindTooltip) {
          meRef.current.bindTooltip(label, {
            permanent: true, direction: 'top', offset: [0, -10], className: 'cp-me-label'
          });
        }
      }

      /* Refit only when the set of carparks or the origin actually changes,
         so the 30-second refresh does not throw away the user's pan. */
      var key = mappableParks.map(function(p) { return p.id; }).join(',') +
                '|' + (userLocation ? userLocation.lat + ',' + userLocation.lng : '');
      if (key !== fitKeyRef.current) {
        fitKeyRef.current = key;
        var pts = mappableParks.map(function(p) { return [p.lat, p.lng]; });
        if (userLocation) pts.push([userLocation.lat, userLocation.lng]);
        if (pts.length === 1) map.setView(pts[0], 16);
        else if (pts.length > 1) map.fitBounds(pts, { padding: [40, 40], maxZoom: 16 });
      }
    }, [viewMode, mappableParks, vehicleType, userLocation, locationLabel, userAccuracy]);

    /* region stats */
    var regionStats = useMemo(function() {
      var pool = selectedRegion === '全部' ? mergedParks
        : mergedParks.filter(function(p) { return p.region === selectedRegion; });
      var st = { light:{a:0,t:0,known:false,tKnown:false}, moto:{a:0,t:0,known:false,tKnown:false},
                 ev:{a:0,t:0,known:false,tKnown:false},    heavy:{a:0,t:0,known:false,tKnown:false} };
      pool.forEach(function(p) {
        var cap = p.capacity || {};
        ['light', 'moto', 'ev', 'heavy'].forEach(function(k) {
          /* Only count readings and totals that exist; a column the feed
             never publishes stays 'unknown' instead of summing to a
             false 0. */
          if (typeof cap[k] === 'number') { st[k].t += cap[k]; st[k].tKnown = true; }
          var v = p.spaces ? p.spaces[k] : null;
          if (v !== null && v !== undefined) { st[k].a += v; st[k].known = true; }
        });
      });
      return { count: pool.length, st: st };
    }, [mergedParks, selectedRegion]);

    function openMap(type, lat, lng, name) {
      var url = '';
      if (type === 'google') url = 'https://www.google.com/maps/dir/?api=1&destination=' + lat + ',' + lng;
      else if (type === 'apple') url = 'http://maps.apple.com/?daddr=' + lat + ',' + lng;
      else if (type === 'amap') url = 'https://uri.amap.com/navigation?to=' + lng + ',' + lat + ',' + encodeURIComponent(name) + '&mode=car';
      window.open(url, '_blank');
    }

    function connBadge() {
      if (connStatus === 'ok') return { cls:'bg-green-100 text-green-800', text:'官方數據已接通' };
      if (connStatus === 'delayed') return { cls:'bg-orange-100 text-orange-800', text:'數據連接延遲' };
      if (connStatus === 'error') return { cls:'bg-red-100 text-red-800', text:'未能讀取數據' };
      return { cls:'bg-gray-100 text-gray-600', text:'連接中…' };
    }

    function spaceColor(count, cap) {
      if (count === null || count === undefined) return 'text-gray-400';
      if (cap === 0) return 'text-gray-400';
      if (count === 0) return 'text-red-600 font-bold pulse-red';
      if (count <= 19) return 'text-amber-500 font-bold';
      return 'text-emerald-600 font-bold';
    }

    var badge = connBadge();
    var fmtTs = function(ts) {
      if (!ts) return '';
      try {
        var d = new Date(ts);
        return d.toLocaleDateString('zh-MO') + ' ' + d.toLocaleTimeString('zh-MO', {hour:'2-digit',minute:'2-digit'});
      } catch(e) { return ts; }
    };

    /* ──────────────── RENDER ──────────────── */
    return (
      <div className="min-h-screen bg-gray-100 flex justify-center">
        <div className="w-full max-w-md bg-white shadow-2xl flex flex-col relative" style={{minHeight:'100vh'}}>

          {/* ── Header ── */}
          <div className="bg-emerald-600 text-white px-5 pt-5 pb-4 shadow-lg z-20">
            <div className="flex items-center justify-between mb-1">
              <div className="flex items-center space-x-2">
                <i className="fa-solid fa-square-parking text-2xl"></i>
                <h1 className="text-xl font-bold tracking-wide">澳門找車位</h1>
                <span className="text-[11px] bg-emerald-700 px-2 py-0.5 rounded-full opacity-80">小助手</span>
              </div>
              <div className="flex items-center space-x-2">
                <span className={'text-[10px] px-2 py-1 rounded-full font-semibold ' + badge.cls}>
                  {connStatus === 'ok' || connStatus === 'delayed'
                    ? <span><i className="fa-solid fa-circle-dot mr-1 text-[8px]"></i>{badge.text}</span>
                    : badge.text}
                </span>
                <button onClick={function(){ setShowSettings(!showSettings); }}
                  className="w-8 h-8 rounded-full bg-emerald-700 hover:bg-emerald-800 flex items-center justify-center transition-colors">
                  <i className="fa-solid fa-gear text-sm"></i>
                </button>
              </div>
            </div>
            <div className="flex items-center justify-between">
              <p className="text-emerald-200 text-xs">
                {parksBase.length > 0
                  ? '全澳 ' + parksBase.length + ' 個公共停車場'
                  : '正在向交通事務局取得停車場名單…'}
              </p>
              <div className="flex items-center space-x-2">
                {lastRtTs ? (
                  <p className="text-emerald-300 text-[10px]">
                    更新：{lastRtTs.toLocaleTimeString('zh-MO', {hour:'2-digit',minute:'2-digit',second:'2-digit'})}
                  </p>
                ) : (
                  <p className="text-emerald-300 text-[10px]">尚未取得數據</p>
                )}
                <button
                  onClick={function(){ fetchRealtime(false); }}
                  disabled={rtLoading}
                  className="text-emerald-300 hover:text-white disabled:opacity-40 transition-colors"
                  title="立即重新整合數據">
                  <i className={'fa-solid fa-rotate text-xs' + (rtLoading ? ' spin' : '')}></i>
                </button>
              </div>
            </div>
            {(connStatus === 'error' || connStatus === 'delayed') && lastErrMsg && (
              <div className="mt-1">
                <div className="flex items-center space-x-3">
                  <button onClick={function(){ setShowDiag(!showDiag); }}
                    className="text-emerald-300 text-[10px] underline opacity-80 hover:opacity-100">
                    <i className={'fa-solid fa-chevron-' + (showDiag ? 'up' : 'down') + ' mr-1 text-[8px]'}></i>
                    {showDiag ? '收起診斷' : '連線診斷詳情'}
                  </button>
                  {showDiag && (
                    <button onClick={copyDiag}
                      className="text-emerald-300 text-[10px] underline opacity-80 hover:opacity-100">
                      <i className="fa-solid fa-copy mr-1 text-[8px]"></i>{diagCopied ? '已複製' : '複製'}
                    </button>
                  )}
                </div>
                {showDiag && (
                  <pre className="text-emerald-200 text-[9px] mt-1 opacity-80 whitespace-pre-wrap break-all leading-relaxed">
                    {lastErrMsg}
                  </pre>
                )}
              </div>
            )}
          </div>

          {/* ── Settings Panel ── */}
          {showSettings && (
            <div className="bg-slate-800 text-white px-5 py-4 border-b border-slate-700 z-10">
              <h2 className="font-bold text-sm mb-3 flex items-center space-x-2">
                <i className="fa-solid fa-sliders"></i>
                <span>系統設定</span>
              </h2>

              {syncReminder && (
                <div className="mb-3 p-2 bg-yellow-600 rounded text-xs flex items-start space-x-2">
                  <i className="fa-solid fa-triangle-exclamation mt-0.5"></i>
                  <span>停車場基礎資料已超過半年未更新，建議重新同步。</span>
                </div>
              )}

              <div className="bg-slate-700 rounded-lg p-3 mb-3">
                <div className="text-xs font-semibold text-slate-300 mb-2">停車場基礎資料同步</div>
                <div className="text-[10px] text-slate-400 mb-2">
                  從交通局 API 更新停車場名稱、位置、地址及總容量。<br/>
                  一般半年更新一次即可。
                </div>
                {lastBaseSync && (
                  <div className="text-[10px] text-slate-400 mb-2">
                    上次同步：{fmtTs(lastBaseSync)}
                  </div>
                )}
                <button
                  onClick={syncBaseData}
                  disabled={baseSyncLoading}
                  className="w-full py-2 bg-emerald-600 hover:bg-emerald-500 rounded-lg text-sm font-medium transition-colors disabled:opacity-60 flex items-center justify-center space-x-2"
                >
                  {baseSyncLoading
                    ? <span><i className="fa-solid fa-rotate spin mr-2"></i>同步中…</span>
                    : <span><i className="fa-solid fa-cloud-arrow-down mr-2"></i>立即同步基礎資料</span>}
                </button>
                {baseSyncMsg && (
                  <div className={'mt-2 text-[11px] px-2 py-1 rounded whitespace-pre-wrap break-all ' +
                    (baseSyncMsg.indexOf('成功') !== -1 ? 'bg-green-800 text-green-200' : 'bg-red-800 text-red-200')}>
                    {baseSyncMsg}
                  </div>
                )}
              </div>

              <div className="bg-slate-700 rounded-lg p-3 mb-3">
                <div className="text-xs font-semibold text-slate-300 mb-1">自設中轉網址（進階）</div>
                <div className="text-[10px] text-slate-400 mb-2">
                  本程式係純靜態網站，要借中轉服務先讀到交通局 API。<br/>
                  公用中轉全部失效時，可以填自己控制嘅中轉（例如 Cloudflare Worker），系統會優先用佢。
                </div>
                <input
                  type="url"
                  value={proxyInput}
                  onChange={function(e){ setProxyInput(e.target.value); }}
                  placeholder="https://xxx.workers.dev/"
                  className="w-full px-2 py-1.5 rounded bg-slate-800 text-white text-xs placeholder-slate-500 border border-slate-600 focus:border-emerald-500 outline-none mb-2"
                />
                <button
                  onClick={saveProxy}
                  className="w-full py-2 bg-slate-600 hover:bg-slate-500 rounded-lg text-sm font-medium transition-colors flex items-center justify-center">
                  <i className="fa-solid fa-floppy-disk mr-2"></i>{proxySaved ? '已儲存' : '儲存並重試'}
                </button>
              </div>

              <div className="bg-slate-700 rounded-lg p-3">
                <div className="text-xs font-semibold text-slate-300 mb-1">恢復出廠設定</div>
                <div className="text-[10px] text-slate-400 mb-2">
                  清除已下載嘅停車場資料，再重新向交通事務局攞一次。<br/>
                  本程式冇內建停車場名單，所有資料都係即時由 data.gov.mo 開放數據取得。
                </div>
                <button
                  onClick={factoryReset}
                  className="w-full py-2 bg-red-700 hover:bg-red-600 rounded-lg text-sm font-medium transition-colors flex items-center justify-center space-x-2"
                >
                  <i className="fa-solid fa-rotate-left mr-2"></i>恢復出廠設定
                </button>
              </div>
            </div>
          )}

          {/* ── Control Panel ── */}
          {/* Leaflet's own panes run from z-index 400 (tiles) to 1000
              (controls), while the search suggestions were z-50. With no
              stacking context between them the map painted over the
              dropdown, so on the map view typing appeared to do nothing.
              Giving the panel and the map their own layers settles it. */}
          <div className="relative z-30 px-4 pt-4 pb-3 border-b border-gray-100 bg-white">

            {/* Search box */}
            <div className="relative mb-4">
              <div className="flex items-center border border-gray-300 rounded-xl overflow-hidden shadow-sm focus-within:ring-2 focus-within:ring-emerald-400 focus-within:border-emerald-400">
                <i className="fa-solid fa-magnifying-glass text-gray-400 ml-3"></i>
                <input
                  type="text"
                  value={searchText}
                  onChange={function(e){ handleSearchInput(e.target.value); }}
                  onKeyDown={function(e){ if(e.key==='Enter') handleSearchSubmit(); }}
                  onFocus={function(){ if(suggestions.length>0) setShowSugg(true); }}
                  placeholder="搜尋停車場名稱、編號、地址或地標…"
                  className="flex-1 py-2.5 px-3 text-sm outline-none bg-transparent"
                />
                {searchLoading
                  ? <i className="fa-solid fa-rotate spin text-emerald-500 mr-3"></i>
                  : searchText
                    ? <button onClick={clearFocus}
                        className="mr-3 text-gray-400 hover:text-gray-600">
                        <i className="fa-solid fa-xmark"></i>
                      </button>
                    : null}
                <button onClick={handleSearchSubmit}
                  className="bg-emerald-600 text-white px-3 py-2.5 text-sm hover:bg-emerald-700 transition-colors">
                  搜尋
                </button>
              </div>
              {showSugg && suggestions.length > 0 && (
                <div className="absolute left-0 right-0 top-full mt-1 bg-white border border-gray-200 rounded-xl shadow-xl z-50 overflow-hidden">
                  {suggestions.map(function(s) {
                    return (
                      <button key={s.id} onClick={function(){ handleSuggClick(s); }}
                        className="w-full text-left px-4 py-2.5 hover:bg-emerald-50 text-sm border-b border-gray-100 last:border-0 flex items-start space-x-2">
                        <i className="fa-solid fa-square-parking text-emerald-500 text-xs mt-1"></i>
                        <span className="flex-1 min-w-0">
                          <span className="block truncate">{s.name}</span>
                          {s.address && (
                            <span className="block text-[10px] text-gray-400 truncate">{s.address}</span>
                          )}
                        </span>
                        <span className="text-[10px] text-gray-400 whitespace-nowrap mt-0.5">{s.region}</span>
                      </button>
                    );
                  })}
                </div>
              )}
            </div>

            {/* The carpark just looked up, right under the box it was typed
                into: it used to render at the bottom of the list, below the
                location button, the filters and the totals bar, so finding
                one meant scrolling past all of that to read it. */}
            {focusParkId !== null && (
              <div className="mb-4">
                <div className="flex items-center justify-between mb-2">
                  <span className="text-xs font-bold text-blue-800 flex items-center min-w-0">
                    <i className="fa-solid fa-magnifying-glass-location mr-2 shrink-0"></i>
                    <span className="truncate">
                      {focusedPark ? '查詢結果' : '搵唔到呢個停車場'}
                    </span>
                  </span>
                  <button onClick={clearFocus}
                    className="ml-2 shrink-0 text-[11px] text-blue-700 underline hover:text-blue-900">
                    <i className="fa-solid fa-list-ul mr-1"></i>返回全部停車場
                  </button>
                </div>

                {focusedPark ? (
                  <div>
                    {renderParkCard(focusedPark)}
                    <button onClick={function(){ handleCentreOnPark(focusedPark); }}
                      className="mt-2 w-full py-2 rounded-xl bg-blue-50 border border-blue-200 text-blue-700 text-xs font-medium hover:bg-blue-100 transition-colors">
                      <i className="fa-solid fa-location-dot mr-1"></i>睇吓呢個停車場附近仲有咩
                    </button>
                  </div>
                ) : (
                  <div className="text-center text-gray-400 py-8 bg-gray-50 rounded-2xl">
                    <i className="fa-solid fa-square-parking text-3xl mb-2 block text-gray-200"></i>
                    <p className="text-sm">搵唔到呢個停車場</p>
                  </div>
                )}
              </div>
            )}

            {focusParkId === null && parksBase.length > 0 && (
            <React.Fragment>
            {/* GPS button */}
            <button onClick={handleFindParking}
              className="w-full flex items-center justify-center space-x-3 bg-emerald-500 text-white py-3 px-4 rounded-2xl shadow-md shadow-emerald-200 hover:bg-emerald-600 active:scale-95 transition-all mb-4">
              <i className="fa-solid fa-location-crosshairs text-2xl"></i>
              <div className="text-left">
                <div className="font-bold text-lg tracking-wider">搵 車 位</div>
                <div className="text-[11px] opacity-80">以手機定位找附近停車場</div>
              </div>
              {userLocation && (
                <div className="ml-auto bg-emerald-600 rounded-lg px-2 py-1 text-xs">
                  <i className="fa-solid fa-location-dot mr-1"></i>{locationLabel || '已定位'}
                </div>
              )}
            </button>

            {/* GPS error */}
            {gpsError && (
              <div className="mb-3 p-2.5 bg-red-50 text-red-600 rounded-lg text-sm flex items-start space-x-2">
                <i className="fa-solid fa-triangle-exclamation mt-0.5 shrink-0"></i>
                <span>{gpsError}</span>
              </div>
            )}

            {/* Region filter */}
            <div className="mb-3">
              <label className="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2">區域查詢</label>
              <div className="flex flex-wrap gap-1.5">
                {regions.map(function(reg) {
                  return (
                    <button key={reg} onClick={function(){ setSelectedRegion(reg); }}
                      className={'py-1 px-2.5 text-xs rounded-full border transition-colors ' +
                        (selectedRegion === reg
                          ? 'bg-emerald-600 text-white border-emerald-600 font-semibold shadow-sm'
                          : 'bg-white text-gray-600 border-gray-200 hover:bg-gray-50')}>
                      {reg}
                    </button>
                  );
                })}
              </div>
            </div>

            {/* Vehicle type */}
            <div className="mb-3">
              <label className="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2">車輛類型</label>
              <div className="grid grid-cols-3 gap-2">
                {[
                  { id:'light', label:'輕型車',  icon:'fa-car' },
                  { id:'ev',    label:'電動車',  icon:'fa-bolt' },
                  { id:'moto',  label:'電單車',  icon:'fa-motorcycle' }
                ].map(function(v) {
                  return (
                    <button key={v.id} onClick={function(){ setVehicleType(v.id); }}
                      className={'py-2 text-sm rounded-xl border transition-colors flex flex-col items-center space-y-1 ' +
                        (vehicleType === v.id
                          ? 'bg-blue-50 border-blue-400 text-blue-700 font-bold shadow-sm'
                          : 'bg-white border-gray-200 text-gray-600 hover:bg-gray-50')}>
                      <i className={'fa-solid ' + v.icon + ' text-base'}></i>
                      <span className="text-xs">{v.label}</span>
                    </button>
                  );
                })}
              </div>
            </div>

            {/* Radius (only when location set) */}
            {userLocation && (
              <div className="mb-3">
                <label className="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2">搜尋範圍</label>
                <div className="grid grid-cols-5 gap-1">
                  {[{v:500,l:'500m'},{v:1000,l:'1km'},{v:2000,l:'2km'},{v:3000,l:'3km'},{v:Infinity,l:'全部'}].map(function(r) {
                    return (
                      <button key={r.v} onClick={function(){ setRadius(r.v); }}
                        className={'py-1.5 text-[11px] rounded-lg transition-colors ' +
                          (radius === r.v ? 'bg-gray-800 text-white font-medium' : 'bg-gray-100 text-gray-600 hover:bg-gray-200')}>
                        {r.l}
                      </button>
                    );
                  })}
                </div>
              </div>
            )}

            {/* Sort */}
            <div>
              <label className="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2">排序方式</label>
              <div className="grid grid-cols-3 gap-2">
                {[{id:'distance',l:'距離最近'},{id:'spaces',l:'車位最多'},{id:'fee',l:'收費最低'}].map(function(s) {
                  return (
                    <button key={s.id} onClick={function(){ setSortBy(s.id); }}
                      className={'py-2 text-xs rounded-xl border transition-colors ' +
                        (sortBy === s.id
                          ? 'bg-emerald-50 border-emerald-500 text-emerald-700 font-bold'
                          : 'bg-white border-gray-200 text-gray-600 hover:bg-gray-50')}>
                      {s.l}
                    </button>
                  );
                })}
              </div>
            </div>

            {/* Finding a carpark is a question about places, so the same
                list is also offered on a map. */}
            <div className="mt-4 grid grid-cols-2 gap-2 bg-gray-100 p-1 rounded-xl">
              {[{id:'list', l:'清單', icon:'fa-list-ul'}, {id:'map', l:'地圖', icon:'fa-map-location-dot'}].map(function(v) {
                return (
                  <button key={v.id} onClick={function(){ setViewMode(v.id); }}
                    className={'py-2 text-sm rounded-lg transition-colors flex items-center justify-center space-x-2 ' +
                      (viewMode === v.id
                        ? 'bg-white shadow-sm text-emerald-700 font-bold'
                        : 'text-gray-500 hover:text-gray-700')}>
                    <i className={'fa-solid ' + v.icon + ' text-xs'}></i>
                    <span>{v.l}</span>
                  </button>
                );
              })}
            </div>
            </React.Fragment>
            )}
          </div>

          {/* ── Region Stats Bar ── */}
          {focusParkId === null && parksBase.length > 0 && (
          <div className="bg-emerald-50 px-4 py-2.5 border-b border-emerald-100">
            <div className="flex justify-between items-center mb-1.5">
              <span className="text-xs font-bold text-emerald-800">{selectedRegion} ({regionStats.count}個停車場)</span>
              <span className="text-[10px] text-emerald-600">空置 / 總數</span>
            </div>
            <div className="grid grid-cols-4 gap-1.5">
              {[
                {key:'light', icon:'fa-car',        color:'text-blue-500',   label:'輕型', sel:'light'},
                {key:'ev',    icon:'fa-bolt',        color:'text-green-500',  label:'電動', sel:'ev'},
                {key:'moto',  icon:'fa-motorcycle',  color:'text-orange-500', label:'電單車', sel:'moto'},
                {key:'heavy', icon:'fa-truck',       color:'text-slate-500',  label:'重型', sel:'all'}
              ].map(function(item) {
                var st = regionStats.st[item.key];
                var active = vehicleType === item.sel;
                return (
                  <div key={item.key}
                    className={'bg-white rounded-lg p-1.5 text-center shadow-sm border ' +
                      (active ? 'border-blue-400 ring-1 ring-blue-300' : 'border-emerald-100')}>
                    <i className={'fa-solid ' + item.icon + ' ' + item.color + ' text-xs mb-0.5'}></i>
                    <div className="text-[9px] text-gray-400">{item.label}</div>
                    <div className="text-xs font-bold text-gray-800">
                      {st.known
                        ? <span className={spaceColor(st.a, st.tKnown ? st.t : null)}>{st.a}</span>
                        : <span className="text-gray-300 font-normal" title="交通事務局未有提供呢個車型嘅即時數據">---</span>}
                      {st.tKnown && <span className="text-[9px] text-gray-400 font-normal">/{st.t}</span>}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
          )}

          {/* ── Map ── */}
          {focusParkId === null && viewMode === 'map' && parksBase.length > 0 && (
          <div className="relative z-0 flex-1 flex flex-col bg-gray-50" style={{minHeight:'55vh'}}>
            {mapError ? (
              <div className="p-6 text-center text-sm text-gray-500">
                <i className="fa-solid fa-triangle-exclamation text-2xl mb-2 block text-gray-300"></i>
                {mapError}
              </div>
            ) : (
              <div ref={mapElRef} className="flex-1" style={{minHeight:'55vh'}}></div>
            )}
            <div className="px-4 py-2 bg-white border-t border-gray-100 text-[10px] text-gray-400 leading-relaxed">
              數字 = {vehicleType === 'light' ? '輕型車' : vehicleType === 'moto' ? '電單車' : vehicleType === 'ev' ? '電動車' : '全部車型'}可用車位。
              <span className="text-emerald-600 font-bold"> ●</span> 充足
              <span className="text-amber-500 font-bold"> ●</span> 緊張
              <span className="text-red-600 font-bold"> ●</span> 已滿
              <span className="text-gray-400 font-bold"> ●</span> 冇數據
              {unmappableCount > 0 && (
                <span className="block mt-1 text-orange-500">
                  另有 {unmappableCount} 個停車場因交通事務局未提供座標，無法喺地圖上顯示，請用清單檢視。
                </span>
              )}
            </div>
          </div>
          )}

          {/* ── Park List ── */}
          {focusParkId === null && viewMode === 'list' && (
          <div className="flex-1 overflow-y-auto bg-gray-50 pb-20">

            {/* 距離最近 needs a location to sort by */}
            {sortBy === 'distance' && !userLocation && (
              <div className="mx-4 mt-3 rounded-xl bg-amber-50 border border-amber-200 px-3 py-2 text-[11px] text-amber-800 flex items-start">
                <i className="fa-solid fa-circle-info mr-2 mt-0.5 shrink-0"></i>
                <span>未知你喺邊，暫時排唔到距離。㩒上面「搵車位」開定位，或者搜尋一個地標。</span>
              </div>
            )}

            <div className="px-4 py-2 flex justify-between items-center">
              <span className="text-xs text-gray-500">
                {parksBase.length === 0 ? ''
                  : (userLocation && radius !== Infinity
                      ? '找到 ' + displayedParks.length + ' 個停車場'
                      : '列出 ' + displayedParks.length + ' 個停車場')}
              </span>
              {realtimeArr.length > 0 && (
                <span className="text-[10px] text-gray-400">
                  <i className="fa-solid fa-satellite-dish mr-1"></i>
                  即時數據：{realtimeArr.length}個
                </span>
              )}
            </div>

            <div className="px-4 space-y-3 pb-4">
              {displayedParks.map(renderParkCard)}

              {parksBase.length === 0 && baseSyncLoading && (
                <div className="text-center text-gray-400 py-16">
                  <i className="fa-solid fa-rotate spin text-3xl mb-3 block text-emerald-300"></i>
                  <p className="text-sm">正在向交通事務局取得停車場名單…</p>
                  <p className="text-xs mt-1">首次使用需要下載一次</p>
                </div>
              )}

              {/* There is no bundled list to fall back on, so say that
                  plainly rather than show numbers that are not real. */}
              {parksBase.length === 0 && !baseSyncLoading && (
                <div className="text-center py-14 px-6">
                  <i className="fa-solid fa-cloud-arrow-down text-4xl mb-3 block text-gray-200"></i>
                  <p className="text-sm text-gray-500 font-medium">未能取得停車場名單</p>
                  <p className="text-xs mt-2 text-gray-400 leading-relaxed">
                    本程式唔會內建停車場資料，全部即時由交通事務局開放數據取得，所以連唔到就冇嘢可以顯示。
                  </p>
                  <button onClick={function(){ syncBaseData(false); }}
                    className="mt-4 px-5 py-2 rounded-xl bg-emerald-600 text-white text-sm font-medium hover:bg-emerald-700 transition-colors">
                    <i className="fa-solid fa-rotate mr-2"></i>重新嘗試
                  </button>
                  {baseSyncMsg && (
                    <pre className="mt-3 text-[10px] text-gray-400 whitespace-pre-wrap break-all text-left">{baseSyncMsg}</pre>
                  )}
                </div>
              )}

              {displayedParks.length === 0 && parksBase.length > 0 && !rtLoading && (
                <div className="text-center text-gray-400 py-16">
                  <i className="fa-solid fa-square-parking text-4xl mb-3 block text-gray-200"></i>
                  <p className="text-sm">無符合條件的停車場</p>
                  <p className="text-xs mt-1">請嘗試調整搜尋範圍或區域篩選</p>
                </div>
              )}
            </div>
          </div>
          )}

          {/* ── Mock location FAB ── */}
          <button onClick={handleMockLocation}
            className="fixed bottom-6 right-6 bg-slate-800 text-white p-3 rounded-full shadow-2xl hover:bg-slate-700 active:scale-95 transition-all z-50 border border-slate-600"
            title="模擬身處新馬路 (測試用)">
            <i className="fa-solid fa-desktop"></i>
          </button>

        </div>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
