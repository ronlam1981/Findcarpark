<!DOCTYPE html>
<html lang="zh-MO">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>澳門找車位小助手</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
  <style>
    body { -webkit-tap-highlight-color: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    @keyframes pulse-red {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .pulse-red { animation: pulse-red 1.2s ease-in-out infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spin { animation: spin 1s linear infinite; display: inline-block; }

    /* Map pins carry the free-space count itself, so the map answers
       "where can I park" without tapping every marker. */
    .cp-pin-wrap { background: none !important; border: none !important; }
    .cp-pin {
      display: flex; align-items: center; justify-content: center;
      min-width: 30px; height: 23px; padding: 0 6px;
      border-radius: 12px; border: 2px solid #fff;
      color: #fff; font-size: 11px; font-weight: 700; line-height: 1;
      box-shadow: 0 1px 4px rgba(0,0,0,.35);
      white-space: nowrap;
    }
    .cp-me {
      width: 16px; height: 16px; border-radius: 50%;
      background: #2563eb; border: 3px solid #fff;
      box-shadow: 0 0 0 2px rgba(37,99,235,.4);
    }
    .leaflet-popup-content { margin: 10px 12px; font-size: 13px; }
    .cp-me-label {
      background: #2563eb; color: #fff; border: none; font-size: 11px;
      font-weight: 700; padding: 2px 7px; border-radius: 10px; box-shadow: none;
    }
    .cp-me-label::before { border-top-color: #2563eb !important; }
    .leaflet-container { font-family: inherit; }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
  const { useState, useEffect, useRef, useMemo, useCallback } = React;

  /* ─── Constants ─── */
  const APPCODE = 'APPCODE 09d43a591fba407fb862412970667de4';
  const API_BASE = 'https://dsat.apigateway.data.gov.mo';
  const LS_BASE_KEY  = 'mcp_base_v2';
  const LS_BASE_TS   = 'mcp_base_ts_v2';
  const LS_PROXY_KEY = 'mcp_custom_proxy';
  /* 本程式自己嘅中轉，已經內建，用戶唔使自己填。冇咗佢就要靠公共中轉，
     而嗰啲會執笠會收費 —— 要每個用戶自己去開個 Cloudflare 帳戶先用得到，
     等於叫佢哋做開發者。設定入面仍然可以覆蓋，但預設就係呢個。 */
  const DEFAULT_PROXY = 'https://findcarpark-proxy.ronlam1981.workers.dev';
  const LS_HISTORY_KEY = 'mcp_history_v1';
  const LS_HISTORY_OFF = 'mcp_history_off';
  const LS_COLLECT_PLAN = 'mcp_collect_plan';
  const LS_STATS_OPEN = 'mcp_stats_open';
  const LS_FAV_PARKS = 'mcp_fav_parks';
  const LS_FAV_TYPES = 'mcp_fav_types';
  const HALF_YEAR_MS = 180 * 24 * 60 * 60 * 1000;
  const REALTIME_INTERVAL = 30000;
  const FETCH_TIMEOUT = 8000;

  /* ─── Where the carpark list comes from ──────────────────────────────
     Nowhere in this file. The list is fetched from the DSAT open-data API
     (data.gov.mo) and cached in localStorage.

     This used to be a hand-written table of 77 carparks, and it was not
     real: 41 of its 77 phone numbers ended in a repeated digit (2885 5555,
     2888 1111…), 66 of 77 light-vehicle capacities were exact multiples of
     50, the ids ran 1–77 with no gaps, and it listed carparks that do not
     exist in Macau — 栢健停車場 among them. Motorcycle counts were wrong
     throughout. Generated placeholder data presented as fact is worse than
     no data at all in a tool people use to decide where to drive, so it is
     gone rather than corrected.

     Sourcing the list from the API also means carparks DSAT adds later —
     the recent temporary outdoor ones, for instance — appear on their own,
     with no release needed here. */

  /* Geographic zones derived from each carpark's coordinates. These are
     island/peninsula zones, not official parish (堂區) boundaries: the
     thresholds fall in the water between them, so the assignment is
     unambiguous without inventing an administrative label the data does
     not carry. */
  /* 石排灣（澳門人慣常當佢屬路環）啱好跌落氹仔同路氹城之間嗰個緯度帶，
     所以純粹靠緯度分嘅四大島區，會將佢分錯做「路氹城」。緯度帶只反映
     地理位置嘅粗略範圍，唔反映澳門人實際點分地段。

     所以呢度改為：先攞交通事務局提供嘅真實地址／名稱，撞下有冇熟悉嘅
     地段名（呢啲名一早已經確立，唔係我哋自己作出嚟嘅），撞到就用嗰個
     分類；撞唔到先退返用緯度帶做保底（例如地址空白，或者出現咗一個
     未列入嘅新街名）。keywords 要由專門到廣泛咁排，等「路氹城」入面
     嘅「氹」字唔會搶咗「氹仔」嘅比對。

     呢個表冇辦法對住 data.gov.mo 嘅 91 個停車場實際地址逐個核實過
     （呢個環境連唔到嗰個 API），如果見到邊個停車場分錯咗地段，請話低
     個名，可以加返個關鍵字入嚟。 */
  var ZONE_KEYWORDS = [
    ['港珠澳大橋',       ['港珠澳大橋']],
    ['路環',            ['路環', '石排灣', '黑沙', '九澳', '譚公', '荔枝碗', '疊石塘']],
    ['路氹城 / 澳大',    ['路氹', '連貫公路', '官也角', '蓮花', '澳大', '橫琴']],
    ['氹仔',            ['氹仔', '大興', '黑橋', '北安', '馬場', '巴波沙']],
    ['下環 / 內港 / 新馬路', ['下環', '內港', '新馬路', '媽閣', '沙梨頭']],
    ['新口岸 / 皇朝',     ['新口岸', '宋玉生', '孫逸仙', '皇朝', '外港']],
    ['荷蘭園 / 東望洋',   ['荷蘭園', '東望洋', '塔石', '雀仔園', '水塘']],
    ['筷子基 / 青洲',     ['筷子基', '青洲', '林茂塘']],
    ['北區 / 黑沙環',     ['祐漢', '望廈', '黑沙環', '台山']]
  ];

  function zoneOf(park) {
    var text = (park.name || '') + (park.address || '');
    for (var i = 0; i < ZONE_KEYWORDS.length; i++) {
      var kws = ZONE_KEYWORDS[i][1];
      for (var j = 0; j < kws.length; j++) {
        if (text.indexOf(kws[j]) !== -1) return ZONE_KEYWORDS[i][0];
      }
    }
    /* 冇撞到已知地名（地址空白，或者一個未收錄嘅新街名）：退返用粗略嘅
       緯度帶，好過乜都唔分。 */
    var lat = park.lat;
    if (!lat) return '未分區';
    if (lat >= 22.175) return '澳門半島';
    if (lat >= 22.148) return '氹仔';
    if (lat >= 22.128) return '路氹城 / 澳大';
    return '路環';
  }

  var ZONE_ORDER = [
    '北區 / 黑沙環', '筷子基 / 青洲', '荷蘭園 / 東望洋', '新口岸 / 皇朝',
    '下環 / 內港 / 新馬路', '澳門半島', '氹仔', '路氹城 / 澳大', '路環', '港珠澳大橋', '未分區'
  ];

  /* The filter offers only the zones the fetched data actually contains. */
  function zonesPresent(parks) {
    var seen = {};
    for (var i = 0; i < parks.length; i++) seen[parks[i].region] = true;
    var out = ['全部'];
    for (var j = 0; j < ZONE_ORDER.length; j++) {
      if (seen[ZONE_ORDER[j]]) out.push(ZONE_ORDER[j]);
    }
    return out;
  }

  /* ─── Utility ─── */
  function calcDistance(lat1, lon1, lat2, lon2) {
    var R = 6371000;
    var f1 = lat1 * Math.PI / 180, f2 = lat2 * Math.PI / 180;
    var df = (lat2 - lat1) * Math.PI / 180, dl = (lon2 - lon1) * Math.PI / 180;
    var a = Math.sin(df/2)*Math.sin(df/2) + Math.cos(f1)*Math.cos(f2)*Math.sin(dl/2)*Math.sin(dl/2);
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  }

  function feeInfo() {
    var h = new Date().getHours();
    return (h >= 8 && h < 20) ? { fee:6, label:'日間 08:00-20:00' } : { fee:3, label:'夜間 20:00-08:00' };
  }

  /* DSAT publishes the readings as XML attributes whose spelling drifts
     between endpoints (Car_CNT here, CP_ID there, NameC elsewhere), and an
     XML document — unlike an HTML one — matches attribute and tag names
     case-sensitively. Looking for 'CAR_CNT' therefore silently missed the
     real 'Car_CNT' and every count came back 0. Match without regard to
     case, and keep the caller's list order as the preference order so the
     documented name still wins when a record carries more than one. */
  function getVal(el, tags) {
    var wanted = {};
    for (var i = 0; i < tags.length; i++) {
      var k = tags[i].toLowerCase();
      if (!(k in wanted)) wanted[k] = i;
    }
    var bestRank = -1, bestVal = '';

    var attrs = el.attributes || [];
    for (var a = 0; a < attrs.length; a++) {
      var rank = wanted[(attrs[a].name || '').toLowerCase()];
      var v = (attrs[a].value || '').trim();
      if (rank !== undefined && v && (bestRank === -1 || rank < bestRank)) {
        bestRank = rank; bestVal = v;
      }
    }
    if (bestRank !== -1) return bestVal;

    var kids = el.childNodes || [];
    for (var c = 0; c < kids.length; c++) {
      if (kids[c].nodeType !== 1) continue;
      var r = wanted[(kids[c].nodeName || '').toLowerCase()];
      var t = (kids[c].textContent || '').trim();
      if (r !== undefined && t && (bestRank === -1 || r < bestRank)) {
        bestRank = r; bestVal = t;
      }
    }
    return bestRank !== -1 ? bestVal : '';
  }

  /* Element lookup, likewise case-insensitive. */
  function findItems(doc, names) {
    var wanted = {};
    for (var i = 0; i < names.length; i++) wanted[names[i].toLowerCase()] = true;
    var all = doc.getElementsByTagName('*');
    var out = [];
    for (var j = 0; j < all.length; j++) {
      if (wanted[(all[j].nodeName || '').toLowerCase()]) out.push(all[j]);
    }
    return out;
  }

  var ITEM_TAGS = ['Car_park_info', 'carparkInfo', 'CarParkInfo'];

  /* Lists the field names the first record actually carries. When DSAT
     renames a field again, this turns a screenful of silent zeroes into a
     diagnostic that names the fields on offer. */
  function sampleFields(text) {
    try {
      var items = findItems(new DOMParser().parseFromString(text, 'text/xml'), ITEM_TAGS);
      if (!items.length) return '（冇記錄）';
      var el = items[0], names = [];
      var attrs = el.attributes || [];
      for (var i = 0; i < attrs.length; i++) names.push(attrs[i].name);
      var kids = el.childNodes || [];
      for (var j = 0; j < kids.length; j++) {
        if (kids[j].nodeType === 1) names.push('<' + kids[j].nodeName + '>');
      }
      return names.length ? names.join(', ') : '（該記錄冇任何欄位）';
    } catch (e) { return '（讀唔到欄位名）'; }
  }

  /* Macau sits in a small box. The feed names its axes X_coords / Y_coords
     without saying which is latitude, and a swap would drop every carpark
     into the sea, so accept a pair only if it actually lands in Macau —
     trying the other order before giving up. */
  function macauCoords(x, y) {
    function inBox(lat, lng) {
      return lat > 22.0 && lat < 22.3 && lng > 113.4 && lng < 113.7;
    }
    if (inBox(y, x)) return { lat: y, lng: x };
    if (inBox(x, y)) return { lat: x, lng: y };
    return null;
  }

  function toInt(s) { return parseInt(s, 10) || 0; }
  /* A reading the feed simply does not publish is not "zero free spaces".
     Returning null keeps the two apart so the card can show "---" rather
     than a red 已滿 for a vehicle type DSAT never reports on. */
  function toCount(s) {
    if (s === '' || s === null || s === undefined) return null;
    var n = parseInt(s, 10);
    return isNaN(n) ? null : n;
  }
  function toFloat(s) { return parseFloat(s) || 0; }

  /* ─── XML Parsers ─── */
  function parseMaintenanceXml(text) {
    var doc = new DOMParser().parseFromString(text, 'text/xml');
    var items = findItems(doc, ITEM_TAGS);
    var result = [];
    for (var i = 0; i < items.length; i++) {
      var el = items[i];
      /* The realtime feed keys on ID, which matches car_park_detail's CP_ID. */
      var no   = getVal(el, ['ID', 'CP_ID', 'CAR_PARK_NO', 'NO']);
      var name = getVal(el, ['NameC', 'CNAME', 'Title', 'NAME', 'ENAME']);
      /* Car_CNT = light vehicles, MB_CNT = motorcycles. DSAT does not
         publish EV or heavy-vehicle counts, so those stay null. */
      var lc   = toCount(getVal(el, ['Car_CNT', 'CAR_CNT', 'LIGHT_CAR', 'CAR']));
      var mo   = toCount(getVal(el, ['MB_CNT', 'MO_CNT', 'MOTORCYCLE', 'MOTO']));
      var ev   = toCount(getVal(el, ['EV_CNT', 'EV']));
      var hv   = toCount(getVal(el, ['HEAVY_CNT', 'HEAVY']));
      var when = getVal(el, ['Time', 'UPDATE_TIME', 'TIMESTAMP']);
      if (name || no) {
        result.push({ no: no, name: name, light: lc, moto: mo,
                      ev: ev, heavy: hv, time: when });
      }
    }
    return result;
  }

  function parseDetailXml(text) {
    var doc = new DOMParser().parseFromString(text, 'text/xml');
    var items = findItems(doc, ITEM_TAGS);
    var result = [];
    for (var i = 0; i < items.length; i++) {
      var el = items[i];
      var no      = getVal(el, ['CP_ID', 'ID', 'CAR_PARK_NO', 'NO']);
      var cname   = getVal(el, ['NameC', 'CNAME', 'Title', 'NAME']);
      var addr    = getVal(el, ['ADDRESS_C', 'ADDRESS']);
      var phone   = getVal(el, ['PHONE', 'TEL']);
      var pos     = macauCoords(toFloat(getVal(el, ['X_coords', 'LONGITUDE', 'LNG'])),
                                toFloat(getVal(el, ['Y_coords', 'LATITUDE', 'LAT'])));
      /* Capacity is null when the feed does not publish it, so the card can
         show a count on its own instead of claiming a total of zero. */
      var cap = {
        light: toCount(getVal(el, ['TOTAL_CAR', 'CAR_CAPACITY', 'TOTAL_LIGHT'])),
        moto:  toCount(getVal(el, ['TOTAL_MOTO', 'TOTAL_MB', 'MOTO_CAPACITY'])),
        ev:    toCount(getVal(el, ['TOTAL_EV', 'EV_CAPACITY'])),
        heavy: toCount(getVal(el, ['TOTAL_HEAVY', 'HEAVY_CAPACITY']))
      };
      if (cname || no) {
        var park = { id: no, name: cname || ('停車場 ' + no),
          address: addr, phone: phone,
          lat: pos ? pos.lat : 0, lng: pos ? pos.lng : 0, capacity: cap };
        park.region = zoneOf(park);
        result.push(park);
      }
    }
    return result;
  }

  /* ─── OLD API (allorigins + token-in-URL, confirmed browser-compatible) ─── */
  var OLD_MAINT_URL = 'https://api.data.gov.mo/document/download/ea50a770-cc35-47cc-a3ba-7f60092d4bc4?token=5noP7ySJuj4qVTPB0qZdg1pzJQvezRypy&isNeedFile=0&lang=TC';

  /* ─── Timed fetch helper ─── */
  function timedFetch(url, opts, timeout) {
    return new Promise(function(resolve, reject) {
      var done = false;
      var tid = setTimeout(function() {
        if (!done) { done = true; reject(new Error('timeout')); }
      }, timeout);
      fetch(url, opts || {})
        .then(function(r) { if (!done) { done = true; clearTimeout(tid); resolve(r); } })
        .catch(function(e) { if (!done) { done = true; clearTimeout(tid); reject(e); } });
    });
  }

  function getJson(r) {
    if (!r.ok) {
      return r.text().then(function(t) {
        return Promise.reject(new Error('HTTP_' + r.status + ' · ' + describePayload(t)));
      }, function() {
        return Promise.reject(new Error('HTTP_' + r.status));
      });
    }
    return r.json();
  }
  /* A failing response still carries the reason in its body — the relay's
     own error text, or the upstream's. Throwing away everything but the
     status code turned a specific explanation into a bare "HTTP_403". */
  function getRawText(r) {
    if (!r.ok) {
      return r.text().then(function(t) {
        return Promise.reject(new Error('HTTP_' + r.status + ' · ' + describePayload(t)));
      }, function() {
        return Promise.reject(new Error('HTTP_' + r.status));
      });
    }
    return r.text();
  }

  /* A public CORS proxy that has stopped serving anonymous traffic answers
     with its own HTML error / landing page instead of the upstream body.
     That page contains '<', so a naive "looks like markup" check accepts it:
     the fallback chain stops at that strategy and never tries the remaining
     ones, and the parser then finds zero records — the 'empty_parsed' symptom.
     Require the payload to actually carry a carpark record, so a proxy that
     answers with something else counts as a failure and the chain moves on. */
  var CARPARK_MARKERS = ['carparkinfo', 'car_park_info', 'car_park_no', 'cp_id'];

  function looksLikeCarparkXml(text) {
    if (!text) return false;
    var lower = text.toLowerCase();
    for (var i = 0; i < CARPARK_MARKERS.length; i++) {
      if (lower.indexOf(CARPARK_MARKERS[i]) !== -1) return true;
    }
    return false;
  }

  /* Short, human-readable description of whatever came back, for the
     on-screen diagnostics when every strategy fails. */
  function describePayload(text) {
    var t = (text || '').replace(/\s+/g, ' ').trim();
    if (!t) return 'empty_body';
    var kind = /^<!doctype html|^<html/i.test(t) ? 'HTML頁'
             : (t.charAt(0) === '{' || t.charAt(0) === '[') ? 'JSON'
             : t.charAt(0) === '<' ? 'XML' : '純文字';
    return kind + '/' + t.length + 'B: ' + t.slice(0, 110);
  }

  function requireXml(text) {
    if (!text || text.indexOf('<') === -1) {
      return Promise.reject(new Error('not_xml · ' + describePayload(text)));
    }
    if (!looksLikeCarparkXml(text)) {
      return Promise.reject(new Error('no_carpark_data · ' + describePayload(text)));
    }
    return text;
  }

  /* allorigins /get wraps the body in JSON, and for content types it treats
     as binary it hands back a data: URI rather than the text itself. */
  function fromAllOrigins(j) {
    var c = j && j.contents;
    if (typeof c === 'string' && c.indexOf('data:') === 0) {
      var comma = c.indexOf(',');
      var meta = c.slice(0, comma), body = c.slice(comma + 1);
      if (meta.indexOf('base64') !== -1) {
        try {
          var bin = atob(body);
          var bytes = new Uint8Array(bin.length);
          for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
          /* decode as UTF-8 so the Chinese carpark names survive */
          c = new TextDecoder('utf-8').decode(bytes);
        } catch (e) { c = ''; }
      } else {
        try { c = decodeURIComponent(body); } catch (e) { c = body; }
      }
    }
    return requireXml(c);
  }

  /* Runs the fallback strategies in order and keeps a note of how each one
     failed, so a user who sees the error panel can report the whole chain
     instead of only the last message. */
  function runStrategies(label, steps) {
    var report = [];
    function run(i) {
      if (i >= steps.length) {
        var err = new Error('全部 ' + steps.length + ' 個途徑都失敗');
        err.report = report;
        return Promise.reject(err);
      }
      return steps[i].fn()
        .then(function(text) {
          console.log('[' + label + '] ✅ ' + steps[i].name);
          return text;
        })
        .catch(function(e) {
          var msg = (e && e.message) || 'unknown_error';
          report.push((i + 1) + '. ' + steps[i].name + ' → ' + msg);
          console.warn('[' + label + '] ❌ ' + steps[i].name, msg);
          return run(i + 1);
        });
    }
    return run(0);
  }

  /* ─── CORS proxy front-ends ───────────────────────────────────────────
     This is a static site with no backend, so the official API can only be
     reached through a relay. Each entry says whether it passes our custom
     Authorization header through; the ones that do not are paired with the
     query-parameter form of the credential instead. */
  function viaCorsProxy(url)    { return 'https://corsproxy.io/?' + encodeURIComponent(url); }
  function viaAllOriginsRaw(url){ return 'https://api.allorigins.win/raw?url=' + encodeURIComponent(url); }
  function viaAllOriginsGet(url){ return 'https://api.allorigins.win/get?url=' + encodeURIComponent(url); }
  function viaCodeTabs(url)     { return 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(url); }

  /* Optional relay the user controls (e.g. a Cloudflare Worker). Stored in
     localStorage so it can be set from the settings panel without a redeploy;
     when present it is tried first, because it is the only route here that
     does not depend on a third-party free service staying up. */
  function customProxyBase() {
    try {
      var v = (localStorage.getItem(LS_PROXY_KEY) || '').trim();
      return v || DEFAULT_PROXY;
    } catch (e) { return DEFAULT_PROXY; }
  }
  /* 有冇自己改過（用嚟喺設定度分辨「用緊內建」定「用緊自訂」）。 */
  function hasCustomProxy() {
    try { return !!(localStorage.getItem(LS_PROXY_KEY) || '').trim(); } catch (e) { return false; }
  }
  function buildProxyUrl(base, url) {
    base = (base || '').trim();
    if (!base) return '';
    return base.indexOf('?') === -1
      ? base.replace(/\/$/, '') + '/?url=' + encodeURIComponent(url)
      : base + encodeURIComponent(url);
  }
  function viaCustomProxy(url) {
    return buildProxyUrl(customProxyBase(), url);
  }

  /* Checks a relay the user has typed but not yet saved, end to end, and says
     precisely what went wrong — a wrong URL that silently falls back to the
     public relays is the easiest way to think this is set up when it is not. */
  function testProxyBase(base) {
    base = (base || '').trim();
    if (!base) return Promise.resolve({ ok: false, msg: '請先填入中轉網址。' });
    if (base.indexOf('https://') !== 0) {
      return Promise.resolve({ ok: false, msg: '網址要以 https:// 開頭。' });
    }
    var target = API_BASE + '/car_park_maintance';
    return timedFetch(buildProxyUrl(base, target),
                      { headers: { 'Authorization': APPCODE } }, FETCH_TIMEOUT)
      .then(function(r) {
        if (!r.ok) {
          return r.text().then(function(t) {
            return { ok: false, msg: '中轉回應 HTTP ' + r.status + '：' +
                                     (t || '').replace(/\s+/g, ' ').slice(0, 140) };
          }, function() {
            return { ok: false, msg: '中轉回應 HTTP ' + r.status };
          });
        }
        return r.text().then(function(text) {
          if (!looksLikeCarparkXml(text)) {
            return { ok: false, msg: '連到中轉，但佢回嘅唔係停車場數據 · ' + describePayload(text) };
          }
          var n = parseMaintenanceXml(text).length;
          if (!n) return { ok: false, msg: '收到數據但解析到 0 個停車場 · ' + describePayload(text) };
          return { ok: true, msg: '成功！經你個中轉讀到 ' + n + ' 個停車場嘅即時車位。' };
        });
      })
      .catch(function(e) {
        var m = (e && e.message) || '';
        if (m === 'timeout') return { ok: false, msg: '逾時：中轉冇回應。檢查網址有冇打錯。' };
        var origin = (window.location && window.location.origin) || '你個網站';
        return { ok: false, msg: '連唔到：' + (m || '網絡錯誤') +
                 '。常見原因：網址打錯，或者 Worker 未准許 ' + origin + ' 呢個來源。' };
      });
  }

  /* APPCODE as a bare query parameter, for relays that drop custom headers. */
  function withAppCode(url) {
    var code = APPCODE.replace(/^APPCODE\s+/i, '');
    return url + (url.indexOf('?') === -1 ? '?' : '&') + 'AppCode=' + encodeURIComponent(code);
  }

  function rawXml(url, headers) {
    return timedFetch(url, headers ? { headers: headers } : {}, FETCH_TIMEOUT)
      .then(getRawText).then(requireXml);
  }
  function wrappedXml(url) {
    return timedFetch(url, {}, FETCH_TIMEOUT).then(getJson).then(fromAllOrigins);
  }

  /* ─── Fetch realtime maintenance data ─── */
  function fetchMaintenanceXml() {
    var newUrl = API_BASE + '/car_park_maintance';
    var auth   = APPCODE;
    var steps  = [];

    if (customProxyBase()) {
      steps.push({ name: '自設中轉 (即時)', fn: function() {
        return rawXml(viaCustomProxy(newUrl), { 'Authorization': auth });
      } });
    }

    steps.push(
      /* Header-forwarding routes to the current DSAT endpoint. */
      { name: 'DSAT 直連', fn: function() {
          return rawXml(newUrl, { 'Authorization': auth });
      } },
      { name: 'corsproxy.io + Authorization', fn: function() {
          return rawXml(viaCorsProxy(newUrl), { 'Authorization': auth });
      } },
      { name: 'corsproxy.io + x-cors-headers', fn: function() {
          return rawXml(viaCorsProxy(newUrl),
            { 'x-cors-headers': '{"Authorization":"' + auth + '"}' });
      } },
      /* Header-dropping relays, using the query-parameter credential. */
      { name: 'allorigins/raw + AppCode 參數', fn: function() {
          return rawXml(viaAllOriginsRaw(withAppCode(newUrl)));
      } },
      { name: 'codetabs + AppCode 參數', fn: function() {
          return rawXml(viaCodeTabs(withAppCode(newUrl)));
      } },
      /* Legacy token-in-URL endpoint, which needs no auth header at all. */
      { name: 'allorigins/raw + 舊版來源', fn: function() {
          return rawXml(viaAllOriginsRaw(OLD_MAINT_URL));
      } },
      { name: 'allorigins/get + 舊版來源', fn: function() {
          return wrappedXml(viaAllOriginsGet(OLD_MAINT_URL));
      } },
      { name: 'codetabs + 舊版來源', fn: function() {
          return rawXml(viaCodeTabs(OLD_MAINT_URL));
      } },
      { name: 'corsproxy.io + 舊版來源', fn: function() {
          return rawXml(viaCorsProxy(OLD_MAINT_URL));
      } }
    );

    return runStrategies('即時車位', steps);
  }

  /* ─── Fetch base detail data ─── */
  function fetchDetailXml() {
    var url  = API_BASE + '/car_park_detail';
    var auth = APPCODE;
    var steps = [];

    if (customProxyBase()) {
      steps.push({ name: '自設中轉 (基礎)', fn: function() {
        return rawXml(viaCustomProxy(url), { 'Authorization': auth });
      } });
    }

    steps.push(
      { name: 'DSAT 直連', fn: function() {
          return rawXml(url, { 'Authorization': auth });
      } },
      { name: 'corsproxy.io + Authorization', fn: function() {
          return rawXml(viaCorsProxy(url), { 'Authorization': auth });
      } },
      { name: 'corsproxy.io + x-cors-headers', fn: function() {
          return rawXml(viaCorsProxy(url),
            { 'x-cors-headers': '{"Authorization":"' + auth + '"}' });
      } },
      { name: 'allorigins/raw + AppCode 參數', fn: function() {
          return rawXml(viaAllOriginsRaw(withAppCode(url)));
      } },
      { name: 'allorigins/get + AppCode 參數', fn: function() {
          return wrappedXml(viaAllOriginsGet(withAppCode(url)));
      } },
      { name: 'codetabs + AppCode 參數', fn: function() {
          return rawXml(viaCodeTabs(withAppCode(url)));
      } }
    );

    return runStrategies('基礎資料', steps);
  }

  /* null means DSAT does not report that vehicle type, which is not the
     same as no free spaces — callers that sort or compare must keep them
     apart, so this returns null rather than 0 in that case. */
  function getVehicleSpaces(park, type) {
    if (!park.spaces) return null;
    if (type === 'light') return park.spaces.light;
    if (type === 'moto')  return park.spaces.moto;
    if (type === 'ev')    return park.spaces.ev;
    var sum = null;
    ['light', 'moto', 'ev', 'heavy'].forEach(function(k) {
      if (park.spaces[k] !== null && park.spaces[k] !== undefined) {
        sum = (sum === null ? 0 : sum) + park.spaces[k];
      }
    });
    return sum;
  }

  /* Distance, with unknown distances last and a stable name order between
     them. Used both as a sort key and as a tie-breaker. */
  function byDistance(a, b) {
    if (a.distance === null && b.distance === null) {
      return String(a.name).localeCompare(String(b.name), 'zh-Hant');
    }
    if (a.distance === null) return 1;
    if (b.distance === null) return -1;
    return a.distance - b.distance;
  }

  /* Whichever key the user picked is the primary key. Availability used to
     be applied ahead of it, so 距離最近 put a carpark across the road below
     one two kilometres away whenever the near one was full or unreported —
     and once a vehicle type DSAT does not report was selected, every
     carpark compared equal and the list ignored distance altogether. */
  function parkComparator(sortBy, vehicleType) {
    return function(a, b) {
      if (sortBy === 'distance') return byDistance(a, b);

      if (sortBy === 'fee') {
        if (a.currentFee !== b.currentFee) return a.currentFee - b.currentFee;
        return byDistance(a, b);
      }

      /* 車位最多: a carpark whose count is unknown cannot be ranked by it,
         so those go last — here that demotion is the honest answer rather
         than an override of what the user asked for. */
      var aS = getVehicleSpaces(a, vehicleType);
      var bS = getVehicleSpaces(b, vehicleType);
      var aUnk = (aS === null || aS === undefined);
      var bUnk = (bS === null || bS === undefined);
      if (aUnk && bUnk) return byDistance(a, b);
      if (aUnk) return 1;
      if (bUnk) return -1;
      if (bS !== aS) return bS - aS;
      return byDistance(a, b);
    };
  }

  /* ─── Fuzzy search ───────────────────────────────────────────────────
     Nobody types a carpark's full registered name. Someone after
     「黑沙海灘公園停車場」 types 黑沙公園, and someone after
     「華士古達嘉馬花園停車場」 types 華士古 — so a plain substring test
     finds the first and misses the second. Score instead of filter, and
     rank by how well each candidate matches. */

  /* Ignore the noise words nearly every name ends with, plus spacing, so
     they neither help nor hurt a match. */
  function normaliseQuery(q) {
    return String(q || '').toLowerCase()
      .replace(/[\s\u3000]+/g, '')
      .replace(/(停車場|停車塲|車場|parking|carpark)/g, '');
  }

  function fuzzyScore(query, text) {
    var q = normaliseQuery(query);
    var t = String(text || '').toLowerCase();
    if (!q || !t) return 0;

    var at = t.indexOf(q);
    if (at === 0) return 1000;                     /* starts with it */
    if (at > 0)   return 900 - Math.min(at, 50);   /* contains it, earlier is better */

    /* Every character present, in order but not necessarily adjacent:
       this is what makes 黑沙公園 find 黑沙海灘公園停車場. */
    var pos = 0, gaps = 0, matched = 0, firstAt = -1;
    for (var i = 0; i < q.length; i++) {
      var found = t.indexOf(q.charAt(i), pos);
      if (found === -1) break;
      if (firstAt === -1) firstAt = found;
      gaps += found - pos;
      pos = found + 1;
      matched++;
    }
    if (matched === q.length) {
      return 700 - Math.min(gaps * 4, 250) - Math.min(firstAt * 2, 100);
    }

    /* Out of order, or a character or two off: accept only when most of
       what was typed is there, so one common character cannot match
       everything. */
    var hits = 0;
    for (var j = 0; j < q.length; j++) {
      if (t.indexOf(q.charAt(j)) !== -1) hits++;
    }
    var ratio = hits / q.length;
    return (q.length >= 2 && ratio >= 0.7) ? Math.round(200 * ratio) : 0;
  }

  /* How well one carpark answers the query. The name carries the most
     weight; an address or district match still counts, but ranks below a
     name match so it never displaces one. */
  function parkSearchScore(park, query) {
    var q = String(query || '').trim();
    if (!q) return 0;
    if (String(park.id) === q) return 2000;

    var best = fuzzyScore(q, park.name);
    var addr = fuzzyScore(q, park.address);
    if (addr > 0) addr = Math.max(1, addr - 250);
    var reg  = fuzzyScore(q, park.region);
    if (reg > 0) reg = Math.max(1, reg - 350);
    return Math.max(best, addr, reg);
  }

  /* Pressing 搜尋 has to decide between "they named a carpark" and "they
     named a place". Any positive score used to count as a carpark, so a
     street like 大興街 matched some carpark's address and the place lookup
     never ran. Only a match on the carpark's own name decides it; the
     weak any-order band (≤200) does not count either. */
  function bestNameMatch(parks, query) {
    var best = null, bestScore = 0;
    for (var i = 0; i < parks.length; i++) {
      var sc = fuzzyScore(query, parks[i].name);
      if (sc > 200 && sc > bestScore) { bestScore = sc; best = parks[i]; }
    }
    return best;
  }

  function searchParks(parks, query, limit) {
    var scored = [];
    for (var i = 0; i < parks.length; i++) {
      var sc = parkSearchScore(parks[i], query);
      if (sc > 0) scored.push({ park: parks[i], score: sc, i: i });
    }
    scored.sort(function(a, b) {
      return b.score !== a.score ? b.score - a.score : a.i - b.i;
    });
    return scored.slice(0, limit || 8).map(function(x) { return x.park; });
  }

  /* Same thresholds as the cards' colour scale, as background colours for
     the map pins. */
  function pinColor(count, cap) {
    if (count === null || count === undefined) return '#9ca3af';
    if (cap === 0) return '#9ca3af';
    if (count === 0) return '#dc2626';
    if (count <= 19) return '#f59e0b';
    return '#059669';
  }

  /* ─── Favourites ─────────────────────────────────────────────────────
     Two lists the user curates, both per-device: the carparks they actually
     use, and the vehicle types they actually drive. Everything here fails
     soft — a browser that refuses localStorage loses the preference, not the
     app. */

  /* Every type DSAT's feed has a column for, plus the combined view. EV and
     heavy are listed even though the feed does not currently publish counts
     for them: the app shows "---" for those rather than pretending, and if
     DSAT starts publishing they work with no change here. */
  var VEHICLE_TYPES = [
    { id: 'light', label: '輕型車',  icon: 'fa-car' },
    { id: 'moto',  label: '電單車',  icon: 'fa-motorcycle' },
    { id: 'ev',    label: '電動車',  icon: 'fa-bolt' },
    { id: 'heavy', label: '重型車',  icon: 'fa-truck' },
    { id: 'all',   label: '全部車型', icon: 'fa-layer-group' }
  ];
  /* The two the feed actually reports, so the default row is useful. */
  var DEFAULT_FAV_TYPES = ['light', 'moto'];

  function loadList(key, fallback) {
    try {
      var raw = localStorage.getItem(key);
      if (!raw) return fallback.slice();
      var a = JSON.parse(raw);
      return Array.isArray(a) ? a : fallback.slice();
    } catch (e) { return fallback.slice(); }
  }
  function saveList(key, list) {
    try { localStorage.setItem(key, JSON.stringify(list)); } catch (e) {}
  }

  function loadFavParks() { return loadList(LS_FAV_PARKS, []); }
  function loadFavTypes() {
    var a = loadList(LS_FAV_TYPES, DEFAULT_FAV_TYPES).filter(function(id) {
      return VEHICLE_TYPES.some(function(v) { return v.id === id; });
    });
    return a.length ? a : DEFAULT_FAV_TYPES.slice();
  }

  function toggleIn(list, id) {
    var i = list.indexOf(id);
    var next = list.slice();
    if (i === -1) next.push(id); else next.splice(i, 1);
    return next;
  }

  /* The row shows the starred types, and always the one currently selected —
     otherwise choosing a type from 更多 would make it vanish from the row. */
  function visibleTypes(favTypes, selected) {
    var ids = favTypes.slice();
    if (ids.indexOf(selected) === -1) ids.push(selected);
    return VEHICLE_TYPES.filter(function(v) { return ids.indexOf(v.id) !== -1; });
  }
  function hiddenTypes(favTypes, selected) {
    var shown = visibleTypes(favTypes, selected).map(function(v) { return v.id; });
    return VEHICLE_TYPES.filter(function(v) { return shown.indexOf(v.id) === -1; });
  }

  /* Favourites in the order the user added them, skipping any carpark that
     is no longer in the feed. */
  function favouriteParks(parks, favIds) {
    var byId = {};
    parks.forEach(function(p) { byId[String(p.id)] = p; });
    var out = [];
    favIds.forEach(function(id) {
      var p = byId[String(id)];
      if (p) out.push(p);
    });
    return out;
  }

  /* ─── Busy-hour history ──────────────────────────────────────────────
     There is no server, so nothing can log occupancy around the clock. What
     this does is record what the app already fetches, while it is open, on
     this device only. A pattern therefore builds up over days of use and is
     never shared between phones — the UI says so, and shows the sample count
     behind every figure rather than presenting a thin average as fact.

     Shape: { "<carpark id>": { "<weekday*24+hour>": [sumLight, nLight, sumMoto, nMoto] } }
     A weekday-hour slot is the smallest unit that answers both "每日" and
     "每周", and averaging in place keeps the store flat instead of growing
     with every reading. */

  var SLOTS = 7 * 24;
  var RECORD_EVERY_MS = 5 * 60 * 1000;   /* at most one sample per slot per 5 min */
  var MIN_SAMPLES = 8;                   /* below this, show "collecting" not a chart */
  var HISTORY_MAX_BYTES = 2 * 1024 * 1024;

  function slotOf(date) {
    return date.getDay() * 24 + date.getHours();
  }

  function loadHistory() {
    try {
      var raw = localStorage.getItem(LS_HISTORY_KEY);
      if (!raw) return {};
      var o = JSON.parse(raw);
      return (o && typeof o === 'object') ? o : {};
    } catch (e) { return {}; }
  }

  function saveHistory(h) {
    try {
      var raw = JSON.stringify(h);
      if (raw.length > HISTORY_MAX_BYTES) return 'too_big';
      localStorage.setItem(LS_HISTORY_KEY, raw);
      return 'ok';
    } catch (e) { return 'quota'; }
  }

  function historyEnabled() {
    try { return localStorage.getItem(LS_HISTORY_OFF) !== '1'; } catch (e) { return true; }
  }
  function setHistoryEnabled(on) {
    try {
      if (on) localStorage.removeItem(LS_HISTORY_OFF);
      else localStorage.setItem(LS_HISTORY_OFF, '1');
    } catch (e) {}
  }

  /* Folds one round of readings into the store. Returns the updated store so
     the caller decides when to persist. */
  function addSamples(hist, readings, date) {
    var slot = String(slotOf(date || new Date()));
    for (var i = 0; i < readings.length; i++) {
      var r = readings[i];
      if (!r || !r.no) continue;
      var lightKnown = (r.light !== null && r.light !== undefined);
      var motoKnown  = (r.moto  !== null && r.moto  !== undefined);
      if (!lightKnown && !motoKnown) continue;

      var park = hist[r.no] || (hist[r.no] = {});
      var cell = park[slot] || (park[slot] = [0, 0, 0, 0]);
      if (lightKnown) { cell[0] += r.light; cell[1] += 1; }
      if (motoKnown)  { cell[2] += r.moto;  cell[3] += 1; }
    }
    return hist;
  }

  /* ─── Scheduled collection ───────────────────────────────────────────
     A run with a fixed length that samples every half hour and stops by
     itself. What it cannot do is run in the background: a browser executes
     nothing once its tab is closed, so a seven-day run only collects during
     the hours the app is actually open. That is why progress is reported as
     coverage — taken against expected — instead of just a sample count: the
     gaps are the honest part of the picture. */

  var COLLECT_EVERY_MS = 30 * 60 * 1000;
  var RADIUS_OPTIONS = [
    { m: 500,      label: '500米' },
    { m: 1000,     label: '1公里' },
    { m: 2000,     label: '2公里' },
    { m: Infinity, label: '不限' }
  ];

  var COLLECT_OPTIONS = [
    { days: 1, label: '1 日' },
    { days: 3, label: '3 日' },
    { days: 7, label: '1 星期' }
  ];

  function loadPlan() {
    try {
      var raw = localStorage.getItem(LS_COLLECT_PLAN);
      if (!raw) return null;
      var o = JSON.parse(raw);
      if (!o || !o.startedAt || !o.endsAt) return null;
      return o;
    } catch (e) { return null; }
  }
  function savePlan(plan) {
    try {
      if (plan) localStorage.setItem(LS_COLLECT_PLAN, JSON.stringify(plan));
      else localStorage.removeItem(LS_COLLECT_PLAN);
    } catch (e) {}
  }
  function makePlan(days, now) {
    var start = (now || new Date()).getTime();
    return {
      days: days,
      startedAt: new Date(start).toISOString(),
      endsAt: new Date(start + days * 24 * 60 * 60 * 1000).toISOString(),
      taken: 0
    };
  }
  function planActive(plan, now) {
    if (!plan) return false;
    return (now || Date.now()) < new Date(plan.endsAt).getTime();
  }

  /* Elapsed time, how many half-hour samples that many hours should have
     produced, and how many actually landed. */
  function planProgress(plan, now) {
    if (!plan) return null;
    var t = (now || Date.now());
    var start = new Date(plan.startedAt).getTime();
    var end = new Date(plan.endsAt).getTime();
    var elapsed = Math.max(0, Math.min(t, end) - start);
    var total = end - start;
    var expected = Math.max(1, Math.floor(elapsed / COLLECT_EVERY_MS));
    var taken = plan.taken || 0;
    return {
      done: t >= end,
      elapsedMs: elapsed,
      totalMs: total,
      timePct: total ? Math.min(100, Math.round((elapsed / total) * 100)) : 0,
      expected: expected,
      taken: taken,
      coveragePct: Math.min(100, Math.round((taken / expected) * 100)),
      remainMs: Math.max(0, end - t)
    };
  }

  function fmtDuration(ms) {
    var mins = Math.floor(ms / 60000);
    var d = Math.floor(mins / 1440), h = Math.floor((mins % 1440) / 60), m = mins % 60;
    if (d) return d + ' 日 ' + h + ' 小時';
    if (h) return h + ' 小時 ' + m + ' 分';
    return m + ' 分';
  }

  /* Shared history collected by the relay's cron job. It runs on
     Cloudflare around the clock, so where it exists it beats anything this
     device could gather, and everyone pointed at the same relay sees the
     same picture. */
  function sharedHistoryUrl(base) {
    base = (base || '').trim();
    if (!base) return '';
    return base.indexOf('?') === -1
      ? base.replace(/\/$/, '') + '/?history=1'
      : base + '&history=1';
  }

  function fetchSharedHistory(base) {
    var url = sharedHistoryUrl(base);
    if (!url) return Promise.resolve(null);
    return timedFetch(url, {}, FETCH_TIMEOUT)
      .then(function(r) {
        if (!r.ok) return null;
        return r.json();
      })
      .then(function(j) {
        if (!j || !j.slots || typeof j.slots !== 'object') return null;
        if (!j.samples) return null;
        return j;
      })
      .catch(function() { return null; });
  }

  function countSamples(hist) {
    var n = 0;
    for (var id in hist) {
      if (!Object.prototype.hasOwnProperty.call(hist, id)) continue;
      for (var slot in hist[id]) {
        if (!Object.prototype.hasOwnProperty.call(hist[id], slot)) continue;
        n += Math.max(hist[id][slot][1], hist[id][slot][3]);
      }
    }
    return n;
  }

  /* One carpark's profile for one vehicle type: the 24-hour shape, the
     weekday × hour grid, and how much each figure rests on. */
  function profileFor(hist, parkId, type) {
    var park = (hist && hist[parkId]) || {};
    var sumIdx = (type === 'moto') ? 2 : 0;
    var nIdx   = (type === 'moto') ? 3 : 1;

    var daily = [], weekly = [], h, d;
    for (h = 0; h < 24; h++) daily.push({ sum: 0, n: 0 });
    for (d = 0; d < 7; d++) {
      var row = [];
      for (h = 0; h < 24; h++) row.push({ sum: 0, n: 0 });
      weekly.push(row);
    }

    var total = 0;
    for (var key in park) {
      if (!Object.prototype.hasOwnProperty.call(park, key)) continue;
      var slot = parseInt(key, 10);
      if (isNaN(slot) || slot < 0 || slot >= SLOTS) continue;
      var cell = park[key];
      var sm = cell[sumIdx], n = cell[nIdx];
      if (!n) continue;
      var dow = Math.floor(slot / 24), hr = slot % 24;
      daily[hr].sum += sm;  daily[hr].n += n;
      weekly[dow][hr].sum += sm; weekly[dow][hr].n += n;
      total += n;
    }

    function avg(c) { return c.n ? c.sum / c.n : null; }
    return {
      total: total,
      daily: daily.map(function(c) { return { avg: avg(c), n: c.n }; }),
      weekly: weekly.map(function(row) {
        return row.map(function(c) { return { avg: avg(c), n: c.n }; });
      })
    };
  }

  /* How hard it is to park, 0 = empty, 1 = full. Capacity is the honest
     reference when the feed publishes one; otherwise the carpark's own best
     observed availability stands in, which the caption has to say. */
  function busyScale(profile, capacity) {
    var observed = 0;
    profile.weekly.forEach(function(row) {
      row.forEach(function(c) { if (c.avg !== null && c.avg > observed) observed = c.avg; });
    });
    var usesCapacity = (typeof capacity === 'number' && capacity > 0 && capacity >= observed);
    var ref = usesCapacity ? capacity : observed;
    return {
      usesCapacity: usesCapacity,
      ref: ref,
      busy: function(avgFree) {
        if (avgFree === null || avgFree === undefined || !ref) return null;
        var b = 1 - (avgFree / ref);
        return b < 0 ? 0 : (b > 1 ? 1 : b);
      }
    };
  }

  /* Sequential single-hue ramp (blue 100→650), lightness monotonically
     decreasing, so darker always reads as busier. */
  var BUSY_RAMP = ['#cde2fb', '#9ec5f4', '#5598e7', '#256abf', '#104281'];
  function busyFill(b) {
    if (b === null || b === undefined) return '#f3f4f6';
    var i = Math.floor(b * BUSY_RAMP.length);
    if (i >= BUSY_RAMP.length) i = BUSY_RAMP.length - 1;
    if (i < 0) i = 0;
    return BUSY_RAMP[i];
  }
  /* Cells past the midpoint of the ramp need light text on them. */
  function busyInk(b) {
    return (b !== null && b !== undefined && b >= 0.6) ? '#ffffff' : '#1f2937';
  }

  var DOW_LABELS = ['日', '一', '二', '三', '四', '五', '六'];
  /* Monday first, the way a week is read here. */
  var DOW_ORDER = [1, 2, 3, 4, 5, 6, 0];

  /* ─── localStorage helpers ─── */
  function loadStoredBase() {
    try {
      var raw = localStorage.getItem(LS_BASE_KEY);
      if (raw) return JSON.parse(raw);
    } catch(e) {}
    return null;
  }

  function saveStoredBase(data) {
    try {
      localStorage.setItem(LS_BASE_KEY, JSON.stringify(data));
      localStorage.setItem(LS_BASE_TS, new Date().toISOString());
    } catch(e) {}
  }

  function loadBaseSyncTs() {
    try { return localStorage.getItem(LS_BASE_TS) || null; } catch(e) { return null; }
  }

  function clearStoredBase() {
    try {
      localStorage.removeItem(LS_BASE_KEY);
      localStorage.removeItem(LS_BASE_TS);
    } catch(e) {}
  }

  /* ─── Merge base + realtime ─── */
  function mergeParks(baseList, realtimeArr) {
    var rtMap = {};
    for (var i = 0; i < realtimeArr.length; i++) {
      var r = realtimeArr[i];
      if (r.no) rtMap[String(r.no)] = r;
    }

    return baseList.map(function(park) {
      var rt = rtMap[String(park.id)];
      if (!rt) {
        for (var k = 0; k < realtimeArr.length; k++) {
          var rr = realtimeArr[k];
          if (rr.name && (rr.name.indexOf(park.name) !== -1 || park.name.indexOf(rr.name) !== -1)) {
            rt = rr;
            break;
          }
        }
      }
      var spaces = rt ? { light: rt.light, moto: rt.moto, ev: rt.ev, heavy: rt.heavy }
                      : null;
      var fi = feeInfo();
      return Object.assign({}, park, {
        spaces: spaces,
        hasRealtime: !!rt,
        currentFee: fi.fee,
        feeLabel: fi.label
      });
    });
  }

  /* ─── Main App ─── */
  function App() {
    var storedTs = loadBaseSyncTs();
    var syncOld = storedTs && (Date.now() - new Date(storedTs).getTime() > HALF_YEAR_MS);

    /* Empty until the API answers: there is no local carpark list to fall
       back on, and inventing one is what caused the problem this replaces. */
    var [parksBase, setParksBase]             = useState(loadStoredBase() || []);
    var [realtimeArr, setRealtimeArr]         = useState([]);
    var [connStatus, setConnStatus]           = useState('init'); // 'init'|'ok'|'delayed'|'error'
    var [lastErrMsg, setLastErrMsg]           = useState('');
    var [lastRtTs, setLastRtTs]               = useState(null);
    var [rtLoading, setRtLoading]             = useState(false);
    var [userLocation, setUserLocation]       = useState(null);
    var [locationLabel, setLocationLabel]     = useState('');

    var [sortBy, setSortBy]                   = useState('spaces');
    var [activeNavId, setActiveNavId]         = useState(null);

    var [history, setHistory]                 = useState(loadHistory);
    var [recording, setRecording]             = useState(historyEnabled);
    var [historyWarn, setHistoryWarn]         = useState('');
    var [plan, setPlan]                       = useState(loadPlan);
    var [shared, setShared]                   = useState(null);
    var [planMsg, setPlanMsg]                 = useState('');
    var [nowTick, setNowTick]                 = useState(Date.now());
    var wakeLockRef = useRef(null);
    var [busyPick, setBusyPick]               = useState(null);
    var lastRecordRef = useRef(0);
    var planRef = useRef(null);
    var [mapError, setMapError]               = useState('');
    var mapRef = useRef(null), layerRef = useRef(null), meRef = useRef(null), accRef = useRef(null);
    var mapElRef = useRef(null), fitKeyRef = useRef('');
    var [gpsError, setGpsError]               = useState(null);
    var [searchText, setSearchText]           = useState('');
    /* id of the one carpark the user asked to look up, or null for the list */
    var [focusParkId, setFocusParkId]         = useState(null);
    var [suggestions, setSuggestions]         = useState([]);
    var [showSugg, setShowSugg]               = useState(false);
    var [searchLoading, setSearchLoading]     = useState(false);
    var [searchMsg, setSearchMsg]             = useState('');
    var [showSettings, setShowSettings]       = useState(false);
    var [showDiag, setShowDiag]               = useState(false);
    var [statsOpen, setStatsOpen]             = useState(function() {
      try { return localStorage.getItem(LS_STATS_OPEN) === '1'; } catch (e) { return false; }
    });
    var [diagCopied, setDiagCopied]           = useState(false);
    var [proxyInput, setProxyInput]           = useState(customProxyBase());
    var [proxySaved, setProxySaved]           = useState(false);
    var [proxyTesting, setProxyTesting]       = useState(false);
    var [proxyResult, setProxyResult]         = useState(null);
    var [baseSyncLoading, setBaseSyncLoading] = useState(false);
    var [baseSyncMsg, setBaseSyncMsg]         = useState('');
    var [lastBaseSync, setLastBaseSync]       = useState(storedTs);
    var [syncReminder, setSyncReminder]       = useState(syncOld);
    var lastRtTsRef = useRef(null);
    lastRtTsRef.current = lastRtTs;

    planRef.current = plan;

    /* fetch realtime spaces */
    var fetchRealtime = useCallback(function(isBackground) {
      if (!isBackground) setRtLoading(true);
      return fetchMaintenanceXml()
        .then(function(text) {
          var arr = parseMaintenanceXml(text);
          if (arr.length === 0) {
            return Promise.reject(new Error(
              '取到回應但解析到 0 個停車場 · ' + describePayload(text)));
          }
          /* Records parsed but no readings at all means the feed renamed its
             count fields — the failure that showed every carpark as 0 rather
             than saying anything was wrong. Fail loudly and name the fields. */
          var reported = arr.filter(function(r) {
            return r.light !== null || r.moto !== null || r.ev !== null || r.heavy !== null;
          }).length;
          if (reported === 0) {
            return Promise.reject(new Error(
              '解析到 ' + arr.length + ' 個停車場，但一個車位數都讀唔到（欄位名可能變咗）· 實際欄位：' +
              sampleFields(text)));
          }
          setRealtimeArr(arr);
          setLastRtTs(new Date());
          setConnStatus('ok');

          /* Fold this round into the local busy-hour history. A scheduled
             run sets the cadence to half-hourly and counts what it managed
             to take; otherwise the passive setting records more often so a
             session left open does not drown the average in one afternoon. */
          var now = Date.now();
          var onPlan = planActive(planRef.current, now);
          if (historyEnabled() || onPlan) {
            var every = onPlan ? COLLECT_EVERY_MS : RECORD_EVERY_MS;
            if (now - lastRecordRef.current >= every) {
              lastRecordRef.current = now;
              setHistory(function(prev) {
                var next = addSamples(Object.assign({}, prev), arr, new Date());
                var r = saveHistory(next);
                if (r === 'quota') setHistoryWarn('瀏覽器儲存空間滿，繁忙時間紀錄已停止累積。');
                else if (r === 'too_big') setHistoryWarn('繁忙時間紀錄已達上限，請喺設定清除舊紀錄。');
                return next;
              });
              if (onPlan) {
                setPlan(function(prev) {
                  if (!prev) return prev;
                  var next = Object.assign({}, prev, { taken: (prev.taken || 0) + 1 });
                  savePlan(next);
                  return next;
                });
              }
            }
          }
          console.log('[Realtime OK] parsed', arr.length, 'parks. Sample:', arr[0]);
        })
        .catch(function(e) {
          console.error('[Realtime FAILED]', e && e.message, e && e.report);
          var lines = (e && e.report) ? e.report : [];
          setLastErrMsg([(e && e.message) || 'unknown_error'].concat(lines).join('\n'));
          var prev = lastRtTsRef.current;
          if (prev && (Date.now() - prev.getTime()) < 120000) {
            setConnStatus('delayed');
          } else {
            setConnStatus('error');
          }
        })
        .then(function() {
          if (!isBackground) setRtLoading(false);
        });
    }, []);

    /* Rebuild the carpark list from the DSAT open-data API. The API is the
       only source: nothing here is merged with a local table, so a carpark
       DSAT removes disappears and one it adds shows up. */
    var syncBaseData = useCallback(function(isAuto) {
      setBaseSyncLoading(true);
      if (!isAuto) setBaseSyncMsg('');
      return fetchDetailXml()
        .then(function(text) {
          var parsed = parseDetailXml(text);
          if (parsed.length === 0) {
            return Promise.reject(new Error(
              '取到回應但解析到 0 個停車場 · ' + describePayload(text)));
          }
          saveStoredBase(parsed);
          setParksBase(parsed);
          var ts = new Date().toISOString();
          setLastBaseSync(ts);
          setSyncReminder(false);
          setBaseSyncMsg('同步成功！已從交通事務局取得 ' + parsed.length + ' 個停車場。');
        })
        .catch(function(e) {
          console.error('[BaseSync FAILED]', e && e.message, e && e.report);
          var lines = (e && e.report) ? e.report : [];
          setBaseSyncMsg(['同步失敗：' + (e && e.message ? e.message : '網絡錯誤，請稍後再試')]
            .concat(lines).join('\n'));
        })
        .then(function() {
          setBaseSyncLoading(false);
        });
    }, []);

    var factoryReset = useCallback(function() {
      if (!window.confirm('確定要清除已下載嘅停車場資料並重新向交通事務局取一次？')) return;
      clearStoredBase();
      setParksBase([]);
      setLastBaseSync(null);
      setSyncReminder(false);
      setBaseSyncMsg('已清除，重新下載中…');
      syncBaseData(false);
    }, [syncBaseData]);

    /* on mount: initial realtime fetch + interval */
    useEffect(function() {
      fetchRealtime(false);
      var timer = setInterval(function() { fetchRealtime(true); }, REALTIME_INTERVAL);
      return function() { clearInterval(timer); };
    }, [fetchRealtime]);

    /* Ask the relay for what its cron job has gathered. Best-effort: no
       relay, no KV, or an unreachable one all just mean the local history
       is used instead. */
    useEffect(function() {
      var base = customProxyBase();
      if (!base) { setShared(null); return; }
      var cancelled = false;
      fetchSharedHistory(base).then(function(j) { if (!cancelled) setShared(j); });
      var timer = setInterval(function() {
        fetchSharedHistory(base).then(function(j) { if (!cancelled) setShared(j); });
      }, 15 * 60 * 1000);
      return function() { cancelled = true; clearInterval(timer); };
    }, [proxySaved]);

    /* With no bundled list, the first run has nothing to show until the
       API answers, so fetch it rather than waiting for the settings panel. */
    var didAutoSync = useRef(false);
    useEffect(function() {
      if (didAutoSync.current) return;
      if (parksBase.length === 0) {
        didAutoSync.current = true;
        syncBaseData(true);
      }
    }, [parksBase.length, syncBaseData]);

    /* search autocomplete */
    var handleSearchInput = useCallback(function(val) {
      setSearchText(val);
      if (val.length < 1) {
        setSuggestions([]);
        setShowSugg(false);
        return;
      }
      var matches = searchParks(parksBase, val, 8);
      setSuggestions(matches);
      setShowSugg(matches.length > 0);
    }, [parksBase]);

    /* Look up one carpark. This shows that carpark on its own and leaves the
       location alone: it used to move "your location" onto the carpark, so
       every distance afterwards was measured from there while still being
       presented as the distance from you. */
    var handleSuggClick = useCallback(function(park) {
      if (viewMode === 'fav') setViewMode('list');
      setSearchText(park.name);
      setSuggestions([]);
      setShowSugg(false);
      /* A lookup already bypasses the region and radius filters, so there is
         no need to clear them — and clearing them threw away the search
         radius the user had just set with 搵車位, which did not come back
         when they returned to the list. */
      setFocusParkId(park.id);
    }, [viewMode]);

    /* The other half of a lookup: what else is near that carpark. Here the
       origin really does move, and the header says so. */
    var handleCentreOnPark = useCallback(function(park) {
      setFocusParkId(null);
      setUserLocation({ lat: park.lat, lng: park.lng });
      setLocationLabel('以「' + park.name + '」為中心');
      setSelectedRegion('全部');
      setRadius(1000);
      setSortBy('distance');
    }, []);

    var clearFocus = useCallback(function() {
      setFocusParkId(null);

      setSearchText('');
      setSuggestions([]);
      setShowSugg(false);
    }, []);

    var handleSearchSubmit = useCallback(function() {
      setShowSugg(false);
      setSearchMsg('');
      var q = searchText.trim();
      if (!q) return;

      var named = bestNameMatch(parksBase, q);
      if (named) { handleSuggClick(named); return; }

      /* Not a carpark name, so treat it as a place: find where it is and
         show what is parked around it. */
      setFocusParkId(null);
      if (viewMode === 'fav') setViewMode('list');
      setSearchLoading(true);
      var nomUrl = 'https://nominatim.openstreetmap.org/search?q=' +
        encodeURIComponent(q + ' 澳門') +
        '&format=json&limit=1&countrycodes=mo';
      fetch(nomUrl, { headers: { 'Accept-Language': 'zh' } })
        .then(function(r) { return r.ok ? r.json() : Promise.reject(new Error('HTTP_' + r.status)); })
        .then(function(data) {
          if (data && data.length > 0) {
            var item = data[0];
            setUserLocation({ lat: parseFloat(item.lat), lng: parseFloat(item.lon) });
            setLocationLabel('地點：' + (item.display_name.split(',')[0] || q));
            setUserAccuracy(null);
            setSelectedRegion('全部');
            setRadius(1000);
            setSortBy('distance');
            setSearchMsg('');
          } else {
            /* Saying nothing here was the old behaviour: you pressed 搜尋
               and the screen simply did not change. */

          }

    var historyCount = useMemo(function() { return countSamples(history); }, [history]);

    /* Remembering the choice is a per-device convenience, so localStorage is
       the right place for it and a failure to read or write is harmless. */
    var toggleFavPark = useCallback(function(id) {
      setFavParks(function(prev) {

    var isFavPark = useCallback(function(id) {

    var toggleFavType = useCallback(function(id) {

    var toggleStats = useCallback(function() {
      setStatsOpen(function(prev) {

        return next;
      });
    }, []);

    /* Keeping the screen awake is the difference between a multi-day run
       collecting and a phone locking after a minute. Best-effort: not every
       browser offers it, and losing it is not an error. */
    var releaseWake = useCallback(function() {
      var w = wakeLockRef.current;
      wakeLockRef.current = null;
      if (w && w.release) { try { w.release(); } catch (e) {} }
    }, []);

    var requestWake = useCallback(function() {
      if (!navigator.wakeLock || !navigator.wakeLock.request) return;
      if (wakeLockRef.current) return;

        navigator.wakeLock.request('screen').then(function(w) {
          wakeLockRef.current = w;
          if (w.addEventListener) {
            w.addEventListener('release', function(){ wakeLockRef.current = null; });
          }
        }, function(){});
      } catch (e) {}
    }, []);

    var startCollect = useCallback(function(days) {
      var p = makePlan(days, new Date());
      savePlan(p);
      setPlan(p);
      setHistoryWarn('');
      setPlanMsg('');
      lastRecordRef.current = 0;   /* take the first sample straight away */
      requestWake();
      fetchRealtime(false);
    }, [requestWake, fetchRealtime]);

    var stopCollect = useCallback(function() {
      if (!window.confirm('停止收集？已經收集到嘅數據會保留，只係唔再繼續。')) return;
      savePlan(null);
      setPlan(null);
      releaseWake();
      setPlanMsg('已停止收集。已收集嘅數據仍然保留。');
    }, [releaseWake]);

    /* Ends itself once the window is up, and keeps the countdown moving. */
    useEffect(function() {
      if (!plan) { releaseWake(); return; }
      function check() {
        setNowTick(Date.now());
        if (!planActive(plan, Date.now())) {
          savePlan(null);
          setPlan(null);
          releaseWake();
          setPlanMsg('收集完成！數據已經併入繁忙時間分析，' +
                     '可以喺任何停車場嘅卡片下面睇到圖表。');
        }
      }
      check();
      var timer = setInterval(check, 30000);
      return function() { clearInterval(timer); };
    }, [plan, releaseWake]);

    /* A screen lock drops the wake lock; take it again when we come back. */
    useEffect(function() {
      if (!plan) return;
      function onVisible() {
        if (document.visibilityState === 'visible') requestWake();
      }
      document.addEventListener('visibilitychange', onVisible);
      requestWake();
      return function() { document.removeEventListener('visibilitychange', onVisible); };
    }, [plan, requestWake]);

    var toggleRecording = useCallback(function() {
      var next = !recording;
      setHistoryEnabled(next);
      setRecording(next);
    }, [recording]);

    var clearHistory = useCallback(function() {
      if (!window.confirm('確定清除所有繁忙時間紀錄？呢啲數據只存喺呢部裝置，清咗唔會復原。')) return;
      try { localStorage.removeItem(LS_HISTORY_KEY); } catch (e) {}
      setHistory({});
      setHistoryWarn('');
      setBusyPick(null);
    }, []);

    /* The readings belong to whoever collected them, so they have to be able

    var exportHistory = useCallback(function() {

        note: '澳門找車位小助手 — 本機繁忙時間紀錄。鍵為停車場編號，再為「星期*24+小時」時段，值為 [輕型車總和, 次數, 電單車總和, 次數]。',
        slots: history
      }, null, 2);
      try {
        var blob = new Blob([payload], { type: 'application/json' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = 'findcarpark-busy-' + new Date().toISOString().slice(0, 10) + '.json';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);

    var copyDiag = useCallback(function() {
      var payload = [

        '自設中轉：' + (customProxyBase() || '（未設定）'),
        '',
        lastErrMsg
      ].join('\n');
      var done = function() {
        setDiagCopied(true);
        setTimeout(function(){ setDiagCopied(false); }, 2000);
      };

        navigator.clipboard.writeText(payload).then(done, function(){ window.prompt('請手動複製：', payload); });
      } else {

    var runProxyTest = useCallback(function() {
      setProxyTesting(true);

    /* Save the user-controlled relay and immediately retry through it. */
    var saveProxy = useCallback(function() {
      var v = (proxyInput || '').trim();
      try {
        if (v) localStorage.setItem(LS_PROXY_KEY, v);
        else localStorage.removeItem(LS_PROXY_KEY);
      } catch (e) {}
      setProxySaved(true);

    /* Busy-hour panel for one carpark: the 24-hour shape and the weekday ×

      var daily = (

      var weekly = (
        <div className="mt-4">
          <div className="flex items-baseline justify-between mb-1">
            <span className="text-[11px] font-semibold text-gray-600">每周分佈</span>

            {!scale.usesCapacity && ' 交通事務局未提供呢個停車場嘅總車位，所以繁忙程度係相對佢自己最空嗰陣計。'}

                  { key:'heavy', icon:'fa-truck',      label:'重型',  avail: park.spaces ? park.spaces.heavy  : null, cap: park.capacity ? park.capacity.heavy : null, sel:'all',   ring:'ring-slate-300' }
                ].map(function(item) {

                    <i className="fa-solid fa-map mb-0.5"></i>高德地圖
                  </button>

          </div>

    }

    /* displayed list */
    var mergedParks = useMemo(function() {
      return mergeParks(parksBase, realtimeArr);
    }, [parksBase, realtimeArr]);

    var displayedParks = useMemo(function() {
      var fi = feeInfo();
      var list = mergedParks.map(function(p) {
        var dist = userLocation
          ? Math.round(calcDistance(userLocation.lat, userLocation.lng, p.lat, p.lng))
          : null;
        return Object.assign({}, p, { distance: dist, currentFee: fi.fee, feeLabel: fi.label });

      if (focusParkId !== null) {

      }

      if (selectedRegion !== '全部') {

      }
      if (userLocation && radius !== Infinity) {
        list = list.filter(function(p) { return p.distance !== null && p.distance <= radius; });
      }

      list.sort(parkComparator(sortBy, vehicleType));

      return list;
    }, [mergedParks, userLocation, radius, selectedRegion, vehicleType, sortBy, focusParkId]);

    /* Favourites reuse the decorated rows, so distance and fee read the

    var favList = useMemo(function() {

          : null;

      return favouriteParks(rows, favParks);
    }, [mergedParks, favParks, userLocation]);

    var shownView = (parksBase.length === 0) ? 'list' : viewMode;

      if (focusParkId === null) return null;

       Counting them lets the map say so instead of quietly dropping them. */
    var mappableParks = useMemo(function() {
      return displayedParks.filter(function(p) { return p.lat && p.lng; });
    }, [displayedParks]);
    var unmappableCount = displayedParks.length - mappableParks.length;

    /* ─── Map ─────────────────────────────────────────────────────────

    useEffect(function() {
      if (shownView !== 'map') return;

        return;
      }
      setMapError('');

      /* Switching to the list unmounts the container, so a map kept from

      if (mapRef.current && mapRef.current.getContainer() !== mapElRef.current) {

        meRef.current = null; accRef.current = null;
        fitKeyRef.current = '';
      }

      if (!mapRef.current) {
        if (!mapElRef.current) return;
        var m = L.map(mapElRef.current, { zoomControl: true })

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 19,
          attribution: '地圖 © OpenStreetMap 貢獻者｜車位數據 © 澳門交通事務局'
        }).addTo(m);

      map.invalidateSize();

        var label = (n === null || n === undefined) ? '?' : String(n);

          bar.style.cssText = 'display:flex;gap:6px';

          detail.style.cssText = 'flex:1;padding:5px 8px;border-radius:8px;border:1px solid #d1d5db;background:#fff;font-size:12px;cursor:pointer';
          detail.addEventListener('click', function() {
            setFocusParkId(park.id);
            setViewMode('list');
          });
          var nav = document.createElement('button');
          nav.textContent = '導航';
          nav.style.cssText = 'flex:1;padding:5px 8px;border-radius:8px;border:none;background:#059669;color:#fff;font-size:12px;cursor:pointer';
          nav.addEventListener('click', function() {
            openMap('google', park.lat, park.lng, park.name);
          });
          bar.appendChild(detail); bar.appendChild(nav);
          box.appendChild(bar);
          return box;
        });

        marker.addTo(layerRef.current);
      });

      if (meRef.current) { map.removeLayer(meRef.current); meRef.current = null; }
      if (accRef.current) { map.removeLayer(accRef.current); accRef.current = null; }
      if (userLocation) {
        var label = locationLabel || '我的位置';
        /* How far off the fix might be, drawn rather than left to guess. */
        if (userAccuracy && userAccuracy > 20 && L.circle) {
          accRef.current = L.circle([userLocation.lat, userLocation.lng], {
            radius: userAccuracy, color: '#2563eb', weight: 1,
            fillColor: '#2563eb', fillOpacity: 0.08
          }).addTo(map);
        }
        meRef.current = L.marker([userLocation.lat, userLocation.lng], {
          icon: L.divIcon({ className: 'cp-pin-wrap', html: '<div class="cp-me"></div>',
                            iconSize: [16, 16], iconAnchor: [8, 8] }),
          title: label, zIndexOffset: 1000
        }).addTo(map);
        /* A permanent tooltip puts the place name on the map itself, so the
           blue dot does not need to be tapped to know what it is. */
        if (meRef.current.bindTooltip) {
          meRef.current.bindTooltip(label, {
            permanent: true, direction: 'top', offset: [0, -10], className: 'cp-me-label'
          });
        }
      }

      /* Refit only when the set of carparks or the origin actually changes,
         so the 30-second refresh does not throw away the user's pan. */
      var key = mappableParks.map(function(p) { return p.id; }).join(',') +
                '|' + (userLocation ? userLocation.lat + ',' + userLocation.lng : '');
      if (key !== fitKeyRef.current) {
        fitKeyRef.current = key;
        var pts = mappableParks.map(function(p) { return [p.lat, p.lng]; });
        if (userLocation) pts.push([userLocation.lat, userLocation.lng]);
        if (pts.length === 1) map.setView(pts[0], 16);
        else if (pts.length > 1) map.fitBounds(pts, { padding: [40, 40], maxZoom: 16 });
      }
    }, [shownView, mappableParks, vehicleType, userLocation, locationLabel, userAccuracy]);

    /* region stats */
    var regionStats = useMemo(function() {
      var pool = selectedRegion === '全部' ? mergedParks
        : mergedParks.filter(function(p) { return p.region === selectedRegion; });
      var st = { light:{a:0,t:0,known:false,tKnown:false}, moto:{a:0,t:0,known:false,tKnown:false},
                 ev:{a:0,t:0,known:false,tKnown:false},    heavy:{a:0,t:0,known:false,tKnown:false} };
      pool.forEach(function(p) {
        var cap = p.capacity || {};
        ['light', 'moto', 'ev', 'heavy'].forEach(function(k) {
          /* Only count readings and totals that exist; a column the feed
             never publishes stays 'unknown' instead of summing to a
             false 0. */
          if (typeof cap[k] === 'number') { st[k].t += cap[k]; st[k].tKnown = true; }
          var v = p.spaces ? p.spaces[k] : null;
          if (v !== null && v !== undefined) { st[k].a += v; st[k].known = true; }
        });
      });
      return { count: pool.length, st: st };
    }, [mergedParks, selectedRegion]);

    /* Google 同 Apple Maps 嗰兩條網址係真正嘅「Universal Link」——手機
       系統喺瀏覽器發出任何網絡請求之前就攔截咗，即時開返 App，完全唔使等。
       高德嗰條 uri.amap.com 唔係 Universal Link，佢係一版真.網頁：要先落
       單去攞返個網頁、載入、先至輪到佢自己嘅程式判斷開唔開到 App —— 用戶
       反映「按咗好耐先顯示網頁版」，根源就係呢版慢嘅轉介頁本身。
       修法：跳過嗰版轉介頁，自己直接試 App 嘅原生連結（唔使網絡），
       淨係響冇成功轉去 App 嗰陣（短暫等咗都仲喺呢頁）先至開網頁版做後備，
       而且用新分頁開，唔會搶走／取代緊用緊嘅找車位小助手本身。 */
    function isIOSDevice() {
      return /iPhone|iPad|iPod/i.test(navigator.userAgent || '');
    }

    /* 試 appUrl（例如自訂 scheme，唔支援嘅話手機瀏覽器會靜靜哋乜都唔做，
       唔會跳走／唔會顯示錯誤），過咗 fallbackMs 之後如果都仲喺呢一頁
       （即係話冇成功轉去 App），先開 webUrl 做後備。用戶切咗去 App
       嘅話（document.hidden 變 true）就取消後備，唔使畫蛇添足。 */
    function openAppThenFallback(appUrl, webUrl, fallbackMs, navigate) {
      if (!appUrl || appUrl === webUrl) {
        window.open(webUrl, '_blank');
        return;
      }
      var done = false;
      function cleanup() {
        done = true;
        document.removeEventListener('visibilitychange', onHide);
      }
      function onHide() {
        if (document.hidden) cleanup();   /* App 開咗，用戶已經走咗去嗰邊 */
      }
      document.addEventListener('visibilitychange', onHide);
      setTimeout(function() {
        if (!done && !document.hidden) window.open(webUrl, '_blank');
        cleanup();
      }, fallbackMs || 1200);
      /* navigate 參數淨係畀測試用嚟攔截（jsdom 唔准改 window.location），
         正式運行時永遠冇人傳呢個參數，行為同直接寫 window.location.href 一樣。 */
      (navigate || function(u) { window.location.href = u; })(appUrl);
    }

    /* 純網址砌法，抽出嚟方便獨立測試（唔使掂 window.location）。 */
    function googleMapUrls(lat, lng) {
      return {
        app: 'comgooglemaps://?daddr=' + lat + ',' + lng + '&directionsmode=driving',
        web: 'https://www.google.com/maps/dir/?api=1&destination=' + lat + ',' + lng
      };
    }
    function appleMapUrl(lat, lng) {
      return 'https://maps.apple.com/?daddr=' + lat + ',' + lng;
    }
    function amapUrls(lat, lng, label, iOS) {
      var scheme = iOS ? 'iosamap' : 'androidamap';
      return {
        app: scheme + '://navi?sourceApplication=findcarpark&poiname=' +
          encodeURIComponent(label || '') + '&lat=' + lat + '&lon=' + lng + '&dev=0&style=2',
        web: 'https://uri.amap.com/navigation?to=' + lng + ',' + lat + ',' +
          encodeURIComponent(label || '') + '&mode=car'
      };
    }

    function openMap(type, lat, lng, name) {
      if (type === 'google') {
        var g = googleMapUrls(lat, lng);
        openAppThenFallback(g.app, g.web, 1200);
      } else if (type === 'apple') {
        /* maps.apple.com 本身已經係 Universal Link，冇獨立嘅 App scheme，
           一條網址走天下，OS 會喺攔截層面即時處理，唔使我哋自己再等。 */
        window.open(appleMapUrl(lat, lng), '_blank');
      } else if (type === 'amap') {
        var a = amapUrls(lat, lng, name, isIOSDevice());
        openAppThenFallback(a.app, a.web, 1200);
      }
    }

          <div className="relative z-30 px-4 pt-4 pb-3 border-b border-gray-100 bg-white">

                  onChange={function(e){ handleSearchInput(e.target.value); }}

                </div>

                          : 'bg-white border-gray-200 text-gray-600 hover:bg-gray-50')}>
                      {s.l}
                    </button>
                  );
                })}
              </div>
            </div>

                   {id:'list', l:'清單', icon:'fa-list-ul'},
                   {id:'map', l:'地圖', icon:'fa-map-location-dot'}]

                return (
                  <button key={v.id} onClick={function(){ setViewMode(v.id); }}

                        : 'text-gray-500 hover:text-gray-700')}>
                    <i className={'fa-solid ' + v.icon + ' text-xs'}></i>
                    <span>{v.l}</span>
                  </button>

                {statsOpen ? '空置 / 總數' : '總覽'}

                {key:'ev',    icon:'fa-bolt',        color:'text-green-500',  label:'電動', sel:'ev'},
                {key:'moto',  icon:'fa-motorcycle',  color:'text-orange-500', label:'電單車', sel:'moto'},
                {key:'heavy', icon:'fa-truck',       color:'text-slate-500',  label:'重型', sel:'all'}

                  <div key={item.key}
                    className={'bg-white rounded-lg p-1.5 text-center shadow-sm border ' +

                    <i className={'fa-solid ' + item.icon + ' ' + item.color + ' text-xs mb-0.5'}></i>
                    <div className="text-[9px] text-gray-400">{item.label}</div>

                      {st.tKnown && <span className="text-[9px] text-gray-400 font-normal">/{st.t}</span>}
                    </div>
                  </div>

              })}
            </div>
            )}
          </div>

              <div className="px-4 space-y-3 pb-4">
                {favList.map(renderParkCard)}
              </div>

              <span className="text-emerald-600 font-bold"> ●</span> 充足
              <span className="text-amber-500 font-bold"> ●</span> 緊張
              <span className="text-red-600 font-bold"> ●</span> 已滿

                <span className="block mt-1 text-orange-500">

                </span>
              )}
            </div>
          </div>
          )}

          {focusParkId === null && shownView === 'list' && (
          <div className="flex-1 overflow-y-auto bg-gray-50 pb-20">

                <div className="text-center text-gray-400 py-16">
                  <i className="fa-solid fa-square-parking text-4xl mb-3 block text-gray-200"></i>

                    {userLocation && radius !== Infinity
                      ? '上面「搜尋範圍」揀大啲（例如 2 公里或不限）'
                      : '請嘗試調整區域篩選'}
                  </p>
                </div>
              )}
            </div>
          </div>
          )}

          {/* ── Mock location FAB ── */}
          <button onClick={handleMockLocation}
            className="fixed bottom-6 right-6 bg-slate-800 text-white p-3 rounded-full shadow-2xl hover:bg-slate-700 active:scale-95 transition-all z-50 border border-slate-600"
            title="模擬身處新馬路 (測試用)">
            <i className="fa-solid fa-desktop"></i>
          </button>

        </div>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
